<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Altracker — Simulateur</title>
<meta name="theme-color" content="#0a0e13">
<meta name="color-scheme" content="dark light">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<script>
(function(){try{var th=localStorage.getItem('theme')||(matchMedia('(prefers-color-scheme: light)').matches?'light':'dark');document.documentElement.dataset.theme=th;var m=document.querySelector('meta[name=theme-color]');if(m)m.content=th==='light'?'#f3f5f4':'#0a0e13'}catch(e){}})();
</script>
<style>
:root,[data-theme=dark]{color-scheme:dark;--bg:#0a0e13;--s1:#111820;--s2:#18212b;--bd:#232d39;--tx:#e8edf2;--mu:#8a97a6;--ac:#2dd4bf;--up:#2ebd85;--dn:#f6465d;--wa:#fbbf24;--sh:0 8px 30px #0008}
[data-theme=light]{color-scheme:light;--bg:#f3f5f4;--s1:#fff;--s2:#eef1ef;--bd:#dde2de;--tx:#12171c;--mu:#5f6b76;--ac:#0b8a82;--up:#14915f;--dn:#d6283f;--wa:#9a5b0a;--sh:0 8px 30px #0003}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-top:env(safe-area-inset-top)}
button,a,input{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.mu{color:var(--mu)}.up{color:var(--up)}.dn{color:var(--dn)}.s{font-size:12.5px}
b,.num{font-variant-numeric:tabular-nums}
#app{max-width:1180px;margin:0 auto;padding:0 12px calc(30px + env(safe-area-inset-bottom))}

/* En-tête */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:8px;padding:10px 12px;margin:0 -12px;background:color-mix(in srgb,var(--bg) 84%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.back{display:flex;align-items:center;gap:6px;text-decoration:none;font-weight:700;color:var(--mu)}
.back svg{width:18px;height:18px}
.ttl{font-weight:800;font-size:17px;letter-spacing:-.01em;margin-right:auto}
.paper{font-size:11px;font-weight:700;color:var(--wa);border:1px solid color-mix(in srgb,var(--wa) 45%,transparent);border-radius:20px;padding:1px 8px;margin-left:8px;white-space:nowrap}
.seg{display:flex;background:var(--s1);border:1px solid var(--bd);border-radius:10px;padding:2px}
.seg button{padding:3px 8px;border-radius:8px;font-size:12px;font-weight:700;color:var(--mu)}
.seg button[aria-pressed=true]{background:var(--ac);color:#04201d}
.ib{width:34px;height:34px;display:grid;place-items:center;border-radius:10px;background:var(--s1);border:1px solid var(--bd);color:var(--mu);font-size:16px}
.ib svg{width:17px;height:17px}

/* Portefeuille */
.wal{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:8px}
.wc{background:var(--s1);border:1px solid var(--bd);border-radius:12px;padding:8px 12px;min-width:0}
.wc span{display:block;font-size:11.5px;color:var(--mu);font-weight:600}
.wc b{display:block;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wc small{font-size:11.5px}
@media(max-width:560px){.wal{grid-template-columns:1fr 1fr}.paper{display:none}}

/* Mise en page */
.lay{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:10px;margin-top:10px;align-items:start}
@media(max-width:900px){.lay{grid-template-columns:1fr}}
.card{background:var(--s1);border:1px solid var(--bd);border-radius:16px;padding:12px}

/* Coins */
.coins{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:-2px -2px 8px;padding:2px}
.coins::-webkit-scrollbar{display:none}
.cc{flex:1 0 auto;min-width:92px;text-align:left;padding:7px 10px;border:1px solid var(--bd);border-radius:12px;background:var(--s2)}
.cc[aria-pressed=true]{border-color:var(--ac);background:color-mix(in srgb,var(--ac) 12%,var(--s2))}
.cc b{display:block;font-size:14px}.cc small{font-size:11.5px}
.hd{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 14px}
.hd h1{margin:0;font-size:20px;letter-spacing:-.01em}
.hd .pr{font:800 24px system-ui;font-variant-numeric:tabular-nums}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.bg{font-size:11.5px;font-weight:600;color:var(--mu);background:var(--s2);border-radius:20px;padding:2px 9px}
.ctl{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:10px;flex-wrap:wrap}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pill{padding:3px 11px;border-radius:20px;font-size:12.5px;font-weight:600;color:var(--mu);border:1px solid var(--bd);background:var(--s2)}
.pill[aria-pressed=true]{background:var(--ac);border-color:var(--ac);color:#04201d}
.mode{font-size:12px;font-weight:700;padding:2px 10px;border-radius:20px}
.mode.p{color:var(--wa);background:color-mix(in srgb,var(--wa) 14%,transparent)}
.mode.l{color:var(--ac);background:color-mix(in srgb,var(--ac) 14%,transparent)}
.tip{min-height:20px;font-size:12.5px;color:var(--mu);margin-top:6px;font-variant-numeric:tabular-nums}
#cbox{margin-top:2px}
#ch{display:block;width:100%;touch-action:pan-y;cursor:crosshair;user-select:none}
#ch text{font:11px system-ui;fill:var(--mu)}
#ch .tg{font:700 11px system-ui;fill:#fff}
#ch .lb{font:700 11.5px system-ui}

/* Panneau d'ordre */
.ord h3{margin:0 0 8px;font-size:14px}
.prof{display:grid;gap:6px}
.pf{display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:center;text-align:left;padding:8px 10px;border:1px solid var(--bd);border-radius:12px;background:var(--s2)}
.pf i{font-style:normal;font-size:24px;text-align:center}
.pf b{display:block;font-size:14px}.pf small{display:block;color:var(--mu);font-size:11.5px;line-height:1.3}
.pf em{font-style:normal;font-size:10.5px;font-weight:700;margin-left:6px;padding:1px 7px;border-radius:20px}
.pf[data-p=low] em{color:var(--up);background:color-mix(in srgb,var(--up) 16%,transparent)}
.pf[data-p=mid] em{color:var(--wa);background:color-mix(in srgb,var(--wa) 16%,transparent)}
.pf[data-p=high] em{color:var(--dn);background:color-mix(in srgb,var(--dn) 16%,transparent)}
.pf[aria-pressed=true]{border-color:var(--ac);background:color-mix(in srgb,var(--ac) 10%,var(--s2))}
.lab{display:flex;justify-content:space-between;margin:12px 0 4px;font-size:12px;color:var(--mu);font-weight:600}
.inp{display:flex;align-items:center;background:var(--s2);border:1px solid var(--bd);border-radius:12px;padding:0 12px}
.inp:focus-within{border-color:var(--ac)}
.inp input{flex:1;min-width:0;background:none;border:0;padding:11px 0;font-size:17px;font-weight:700;color:var(--tx);font-variant-numeric:tabular-nums}
.inp input:focus-visible{outline:0}
.inp span{color:var(--mu);font-weight:700;font-size:13px}
.pcts{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:6px}
.pcts button{padding:5px 0;border-radius:8px;background:var(--s2);border:1px solid var(--bd);font-size:12px;font-weight:700;color:var(--mu)}
.sm{margin-top:12px;border-top:1px dashed var(--bd);padding-top:8px}
.rw{display:flex;justify-content:space-between;gap:8px;padding:2px 0;font-size:13px}
.rw span:first-child{color:var(--mu)}
.buy{width:100%;margin-top:12px;padding:13px;border-radius:12px;background:var(--up);color:#04140d;font-weight:800;font-size:15px}
.buy:disabled{opacity:.4;cursor:not-allowed}
.hint{min-height:18px;font-size:12px;color:var(--dn);margin-top:4px;text-align:center}
.odds{margin-top:12px;border-top:1px dashed var(--bd);padding-top:10px}
.ob{display:flex;height:10px;border-radius:5px;overflow:hidden;margin:8px 0 6px;background:var(--s2)}
.ob i{display:block;height:100%}
.ol{display:flex;justify-content:space-between;font-size:11.5px;gap:6px}
.ol span{white-space:nowrap}
.odds p{margin:6px 0 0;font-size:11.5px;color:var(--mu);line-height:1.35}

/* Positions */
.tabs{display:flex;gap:6px;margin-bottom:10px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:10px}
.pc{background:var(--s2);border:1px solid var(--bd);border-radius:14px;padding:10px 12px;cursor:pointer}
.pc[aria-current=true]{border-color:var(--ac)}
.ph{display:flex;justify-content:space-between;align-items:center;gap:8px}
.ph b{font-size:15px}
.pnl{font-weight:800;font-size:14px}
.pg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:6px;font-size:12px}
.pg span{display:block;color:var(--mu);font-size:11px}
.rb{position:relative;height:8px;border-radius:4px;margin:14px 0 6px;background:linear-gradient(90deg,var(--dn) 0,color-mix(in srgb,var(--dn) 30%,var(--bd)) 45%,color-mix(in srgb,var(--up) 30%,var(--bd)) 55%,var(--up) 100%)}
.rb u{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--mu)}
.rb b{position:absolute;top:50%;width:14px;height:14px;border-radius:50%;background:var(--s1);border:3px solid var(--tx);transform:translate(-50%,-50%)}
.pf2{display:flex;justify-content:space-between;align-items:center;font-size:11.5px;color:var(--mu)}
.sell{padding:5px 12px;border-radius:8px;border:1px solid var(--bd);background:var(--s1);font-size:12px;font-weight:700;color:var(--tx)}
.empty{text-align:center;color:var(--mu);padding:26px 10px;border:1px dashed var(--bd);border-radius:14px}
.hr{display:grid;grid-template-columns:1.1fr 1fr 1fr auto;gap:8px;align-items:center;padding:8px 10px;background:var(--s2);border-radius:12px;font-size:12.5px}
.hr small{display:block;color:var(--mu);font-size:11px}
.wh{font-size:11px;font-weight:700;padding:1px 8px;border-radius:20px;white-space:nowrap}
.wh.tp{color:var(--up);background:color-mix(in srgb,var(--up) 15%,transparent)}
.wh.sl{color:var(--dn);background:color-mix(in srgb,var(--dn) 15%,transparent)}
.wh.manual{color:var(--mu);background:var(--s1)}
.hl{display:grid;gap:6px}
.note{margin:16px 2px 0;font-size:11.5px;color:var(--mu);line-height:1.45}

/* Accueil & divers */
dialog{border:1px solid var(--bd);padding:20px;background:var(--s1);color:var(--tx);width:min(420px,94vw);border-radius:20px;box-shadow:var(--sh)}
dialog::backdrop{background:#000a;backdrop-filter:blur(3px)}
dialog h2{margin:0 0 6px;font-size:20px}
.chips{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:6px}
.chips button{padding:7px 0;border-radius:10px;border:1px solid var(--bd);background:var(--s2);font-weight:700;font-size:13px}
.chips button[aria-pressed=true]{border-color:var(--ac);background:color-mix(in srgb,var(--ac) 14%,var(--s2))}
.go{width:100%;margin-top:16px;padding:12px;border-radius:12px;background:var(--ac);color:#04201d;font-weight:800;font-size:15px}
#toast{white-space:pre-line;position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:14px;font-size:13px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:60;max-width:92vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
.sk{height:90px;border-radius:16px;margin-top:10px;background:linear-gradient(90deg,var(--s1),var(--s2),var(--s1));background-size:200% 100%;animation:sk 1.3s infinite}@keyframes sk{to{background-position:-200% 0}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<dialog id="wd"></dialog>

const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:v}catch(e){return d}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};

/* ═════════ Données ═════════ */
const RAW='https://raw.githubusercontent.com/NalistPro/Altracker/main/';
async function j(u){for(const x of u.startsWith('http')?[u]:[u,RAW+u]){try{const r=await fetch(x,{cache:'no-store'});if(r.ok)return await r.json()}catch(e){}}throw new Error(u)}
const S={sc:null,det:null,live:null,px:{},sym:null,prof:'mid',amt:'',rg:90,proj:true,tab:'open',focus:null};
let W=null;                                        // portefeuille fictif
const FEE=.001,MIN=10,KEY='altracker_sim_v1';
const lv=c=>{const x=S.px[c.symbole];return x&&c.prix&&x.prix/c.prix>.5&&x.prix/c.prix<2?x:null};
const coin=s=>S.sc.classement.find(c=>c.symbole===s);
const price=s=>{const c=typeof s==='string'?coin(s):s;return c?(lv(c)||c).prix:null};
const top5=()=>S.sc.top5.map(coin).filter(Boolean);

/* ═════════ Profils de risque & niveaux ═════════ */
const PR={low:{ic:'🧓',k:[1.2,1.8],sl:[.03,.10],tp:[.045,.18]},mid:{ic:'⚖️',k:[2,4],sl:[.05,.20],tp:[.10,.45]},high:{ic:'🚀',k:[3.5,9],sl:[.08,.35],tp:[.25,1.2]}};
const cl=(x,a,b)=>Math.max(a,Math.min(b,x));
function vol(sym){
  const d=S.det&&S.det.coins[sym];if(!d)return .05;
  const c=d.c.slice(-31),r=[];for(let i=1;i<c.length;i++)if(c[i]>0&&c[i-1]>0)r.push(Math.log(c[i]/c[i-1]));
  if(r.length<10)return .05;
  const m=r.reduce((a,b)=>a+b,0)/r.length,s=Math.sqrt(r.reduce((a,b)=>a+(b-m)**2,0)/(r.length-1));
  return cl(s,.01,.15);
}
function levels(sym,pr,p){const P=PR[pr],s=vol(sym),slp=cl(P.k[0]*s,...P.sl),tpp=cl(P.k[1]*s,...P.tp);return{slp,tpp,sl:p*(1-slp),tp:p*(1+tpp)}}
/* Monte-Carlo sans tendance, pseudo-aléatoire déterministe (résultat stable à l'écran) */
const hash=s=>{let h=2166136261;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0};
const rng=a=>()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
function odds(sym,slp,tpp){
  const s=vol(sym),n=80,ss=s/2,lo=Math.log(1-slp),hi=Math.log(1+tpp),r=rng(hash(sym)^Math.round(slp*1e4)^(Math.round(tpp*1e4)<<3));
  let a=0,b=0;const N=2000;
  for(let k=0;k<N;k++){let x=0,res=0;for(let i=0;i<n;i++){x+=ss*Math.sqrt(-2*Math.log(1-r()))*Math.cos(2*Math.PI*r())-.5*ss*ss;if(x<=lo){res=1;break}if(x>=hi){res=2;break}}if(res===1)b++;else if(res===2)a++}
  return[a/N,b/N,1-(a+b)/N];
}

/* ═════════ Moteur de trading fictif ═════════ */
const val=p=>p.qty*price(p.sym)*(1-FEE);
function closePos(p,fill,why,ts){
  const proceeds=p.qty*fill*(1-FEE);W.cash+=proceeds;
  W.hist.unshift({...p,exit:fill,ts2:ts||Date.now(),why,proceeds,pnl:proceeds-p.spent});
  W.pos=W.pos.filter(x=>x.id!==p.id);
  if(S.focus===p.id)S.focus=null;
  return W.hist[0];
}
function evalPos(p){
  const d=S.det&&S.det.coins[p.sym];
  if(d&&S.sc){                                     // clôtures journalières depuis l'entrée
    const base=Date.parse(S.sc.date_donnees+'T00:00:00Z'),len=d.c.length,eDay=Math.floor(p.ts/864e5);
    for(let i=0;i<len;i++){
      const day=Math.floor((base-(len-1-i)*864e5)/864e5);if(day<=eDay)continue;
      if(d.c[i]<=p.sl)return{why:'sl',fill:p.sl,ts:day*864e5+864e5-1};
      if(d.c[i]>=p.tp)return{why:'tp',fill:p.tp,ts:day*864e5+864e5-1};
    }
  }
  const x=price(p.sym);if(x==null)return null;
  if(x<=p.sl)return{why:'sl',fill:Math.min(p.sl,x),ts:Date.now()};
  if(x>=p.tp)return{why:'tp',fill:p.tp,ts:Date.now()};
  return null;
}
const money=n=>`${sg(n,2)} ${W.st}`;
function evalAll(){
  const msgs=[];
  for(const p of [...W.pos]){
    const r=evalPos(p);if(!r)continue;
    const h=closePos(p,r.fill,r.why,r.ts);
    msgs.push(t(r.why==='tp'?'okTP':'okSL').replace('{s}',p.sym).replace('{v}',money(h.pnl)).replace('{u}',W.st));
  }
  if(msgs.length){saveW();toast(msgs.join('\n'),5200)}
  return msgs.length>0;
}

/* ——— Panneau d'ordre (calculs en direct) ——— */
function upd(redraw){
  document.querySelectorAll('.pf').forEach(b=>b.setAttribute('aria-pressed',b.dataset.p===S.prof&&!S.focus));
  $('#st').textContent=W.st;$('#av').textContent=nf(W.cash,2)+' '+W.st;
  const p=price(S.sym),Lv=levels(S.sym,S.prof,p),a=parseFloat(S.amt)||0;
  const qty=a/p*(1-FEE),gSL=qty*Lv.sl*(1-FEE)-a,gTP=qty*Lv.tp*(1-FEE)-a;
  $('#sm').innerHTML=`<div class="rw"><span>${t('entry')}</span><b>${usd(p)}</b></div>
   <div class="rw"><span>${t('qty')}</span><b>${a>0?nf(qty,qty>=100?2:qty>=1?4:6):'–'} ${esc(S.sym)}</b></div>
   <div class="rw"><span>${t('sl')}</span><b class="dn">${usd(Lv.sl)} · −${nf(Lv.slp*100,1)} %</b></div>
   <div class="rw"><span>${t('tp')}</span><b class="up">${usd(Lv.tp)} · +${nf(Lv.tpp*100,1)} %</b></div>
   <div class="rw"><span>${t('maxloss')}</span><b class="dn">${a>0?sg(gSL,2)+' '+W.st:'–'}</b></div>
   <div class="rw"><span>${t('maxgain')}</span><b class="up">${a>0?sg(gTP,2)+' '+W.st:'–'}</b></div>
   <div class="rw"><span>${t('rr')}</span><b>1 : ${nf(Lv.tpp/Lv.slp,1)}</b></div>
   <div class="rw"><span>${t('fee')}</span><b>${a>0?nf(a*FEE,2)+' '+W.st:'–'}</b></div>`;
  const o=odds(S.sym,Lv.slp,Lv.tpp);
  $('#ob').innerHTML=`<i style="width:${o[0]*100}%;background:var(--up)"></i><i style="width:${o[2]*100}%;background:var(--bd)"></i><i style="width:${o[1]*100}%;background:var(--dn)"></i>`;
  $('#ol').innerHTML=`<span class="up">${t('o_tp')} ${nf(o[0]*100,0)} %</span><span class="mu">${t('o_no')} ${nf(o[2]*100,0)} %</span><span class="dn">${t('o_sl')} ${nf(o[1]*100,0)} %</span>`;
  let h='';if(a>0&&a<MIN)h=t('min');else if(a>W.cash+1e-9)h=t('many');
  $('#hint').textContent=h;$('#buy').disabled=!(a>=MIN&&a<=W.cash+1e-9);
  if(redraw)chart();
}
function buy(){
  const a=parseFloat(S.amt)||0;if(a<MIN||a>W.cash+1e-9)return;
  const p=price(S.sym),Lv=levels(S.sym,S.prof,p),id='p'+Date.now().toString(36);
  W.cash-=a;W.pos.push({id,sym:S.sym,ts:Date.now(),entry:p,qty:a/p*(1-FEE),spent:a,sl:Lv.sl,tp:Lv.tp,prof:S.prof});
  saveW();S.focus=id;S.amt='';$('#am').value='';S.tab='open';
  toast(`${t('bought')} : ${nf(a,2)} ${W.st} → ${S.sym} ${PR[S.prof].ic}`);
  full();
}

/* ═════════ Graphique ═════════ */
function ticks(lo,hi,n){const raw=(hi-lo)/n,m=Math.pow(10,Math.floor(Math.log10(raw))),f=raw/m,s=(f<1.5?1:f<3?2:f<7?5:10)*m,a=[];for(let x=Math.ceil(lo/s)*s;x<=hi;x+=s)a.push(x);return a}
function chart(){
  const box=$('#cbox');if(!box||!S.sym)return;
  const d=S.det&&S.det.coins[S.sym];
  if(!d){box.innerHTML=`<div class="empty">${t('nochart')}</div>`;return}
  const Wd=Math.max(320,box.clientWidth||600),H=Math.round(cl(Wd*.62,300,480)),ml=6,mr=72,mt=14,mb=24,pw=Wd-ml-mr,ph=H-mt-mb;
  const p=price(S.sym);let v=d.c.slice(-S.rg);v[v.length-1]=p;
  const N=v.length,FZ=20,TT=N-1+FZ,X=i=>ml+i/TT*pw,sgm=vol(S.sym);
  const fp=S.focus&&W.pos.find(x=>x.id===S.focus&&x.sym===S.sym);
  let tool;
  if(fp)tool={sl:fp.sl,tp:fp.tp,en:fp.entry,xi:Math.max(0,N-1-(Date.now()-fp.ts)/864e5),live:true};
  else{const Lv=levels(S.sym,S.prof,p);tool={sl:Lv.sl,tp:Lv.tp,en:p,xi:N-1,live:false}}
  $('#mode').innerHTML=`<span class="mode ${tool.live?'l':'p'}">${tool.live?t('livep')+' '+PR[fp.prof].ic:t('prev')+' '+PR[S.prof].ic}</span>`;
  let lo=Math.min(...v,tool.sl),hi=Math.max(...v,tool.tp);
  if(S.proj){lo=Math.min(lo,p*Math.exp(-sgm*Math.sqrt(FZ)));hi=Math.max(hi,p*Math.exp(sgm*Math.sqrt(FZ)))}
  const pad=(hi-lo)*.05;lo=Math.max(0,lo-pad);hi+=pad;
  const Y=y=>mt+ph-(y-lo)/(hi-lo)*ph,xr=X(TT),xn=X(N-1),ax=Wd-mr+4,aw=mr-6;
  const dOf=i=>new Date(Date.now()+(i-(N-1))*864e5);
  const tag=(y,txt,bg)=>`<rect x="${ax}" y="${(y-9).toFixed(1)}" width="${aw}" height="18" rx="4" fill="${bg}"/><text class="tg" x="${ax+aw/2}" y="${(y+4).toFixed(1)}" text-anchor="middle">${txt}</text>`;
  const line=v.map((y,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(y).toFixed(1)).join('');
  const up=v[N-1]>=v[0],lc=up?'var(--up)':'var(--dn)';
  let s=`<svg id="ch" viewBox="0 0 ${Wd} ${H}" width="${Wd}" height="${H}"><defs><clipPath id="cp"><rect x="${ml}" y="${mt}" width="${pw}" height="${ph}"/></clipPath><linearGradient id="ar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${up?'#2ebd85':'#f6465d'}" stop-opacity=".30"/><stop offset="1" stop-color="${up?'#2ebd85':'#f6465d'}" stop-opacity="0"/></linearGradient></defs>`;
  ticks(lo,hi,5).forEach(y=>{s+=`<line x1="${ml}" x2="${ml+pw}" y1="${Y(y).toFixed(1)}" y2="${Y(y).toFixed(1)}" stroke="var(--bd)" stroke-width="1" opacity=".7"/><text x="${Wd-mr+6}" y="${(Y(y)+4).toFixed(1)}">${usd(y)}</text>`});
  for(let k=0;k<=4;k++){const i=k/4*(N-1);s+=`<text x="${X(i).toFixed(1)}" y="${H-6}" text-anchor="${k?'middle':'start'}">${dOf(i).toLocaleDateString(L,{day:'numeric',month:'short'})}</text>`}
  s+=`<text x="${xr}" y="${H-6}" text-anchor="end">${dOf(TT).toLocaleDateString(L,{day:'numeric',month:'short'})}</text>`;
  s+=`<g clip-path="url(#cp)"><rect x="${xn}" y="${mt}" width="${xr-xn}" height="${ph}" fill="var(--s2)" opacity=".55"/>`;
  if(S.proj){
    const up_=[],dn_=[];for(let k=0;k<=FZ;k++){const x=X(N-1+k).toFixed(1);up_.push(x+','+Y(p*Math.exp(sgm*Math.sqrt(k))).toFixed(1));dn_.unshift(x+','+Y(p*Math.exp(-sgm*Math.sqrt(k))).toFixed(1))}
    s+=`<polygon points="${up_.concat(dn_).join(' ')}" fill="var(--ac)" opacity=".16"/><line x1="${xn}" x2="${xr}" y1="${Y(p).toFixed(1)}" y2="${Y(p).toFixed(1)}" stroke="var(--ac)" stroke-dasharray="4 4" opacity=".8"/>`;
  }
  const x0=X(tool.xi),yE=Y(tool.en),yT=Y(tool.tp),yS=Y(tool.sl);
  s+=`<rect x="${x0.toFixed(1)}" y="${yT.toFixed(1)}" width="${(xr-x0).toFixed(1)}" height="${Math.max(0,yE-yT).toFixed(1)}" fill="var(--up)" opacity=".15"/>
   <rect x="${x0.toFixed(1)}" y="${yE.toFixed(1)}" width="${(xr-x0).toFixed(1)}" height="${Math.max(0,yS-yE).toFixed(1)}" fill="var(--dn)" opacity=".15"/>
   <line x1="${x0.toFixed(1)}" x2="${xr}" y1="${yT.toFixed(1)}" y2="${yT.toFixed(1)}" stroke="var(--up)" stroke-width="1.6"/>
   <line x1="${x0.toFixed(1)}" x2="${xr}" y1="${yS.toFixed(1)}" y2="${yS.toFixed(1)}" stroke="var(--dn)" stroke-width="1.6"/>
   <line x1="${x0.toFixed(1)}" x2="${xr}" y1="${yE.toFixed(1)}" y2="${yE.toFixed(1)}" stroke="var(--tx)" stroke-dasharray="5 4" opacity=".55"/>
   <text class="lb" x="${(xn+8).toFixed(1)}" y="${(yT-5).toFixed(1)}" style="fill:var(--up)">TP +${nf((tool.tp/tool.en-1)*100,1)} %</text>
   <text class="lb" x="${(xn+8).toFixed(1)}" y="${(yS+15).toFixed(1)}" style="fill:var(--dn)">SL ${nf((tool.sl/tool.en-1)*100,1)} %</text>`;
  s+=`<path d="${line} L${xn.toFixed(1)} ${mt+ph} L${X(0).toFixed(1)} ${mt+ph}Z" fill="url(#ar)"/><path d="${line}" fill="none" stroke="${lc}" stroke-width="2" stroke-linejoin="round"/>`;
  if(tool.live)s+=`<circle cx="${x0.toFixed(1)}" cy="${yE.toFixed(1)}" r="4.5" fill="var(--tx)" stroke="var(--s1)" stroke-width="2"/>`;
  s+=`<line x1="${xn}" x2="${xn}" y1="${mt}" y2="${mt+ph}" stroke="var(--mu)" stroke-dasharray="3 4" opacity=".7"/><text x="${(xn+5).toFixed(1)}" y="${mt+11}">${t('today')}</text>`;
  s+=`<line x1="${ml}" x2="${ml+pw}" y1="${Y(p).toFixed(1)}" y2="${Y(p).toFixed(1)}" stroke="var(--ac)" stroke-dasharray="2 3" opacity=".7"/><circle cx="${xn.toFixed(1)}" cy="${Y(p).toFixed(1)}" r="4" fill="var(--ac)"/>`;
  s+=`<g id="cx" visibility="hidden"><line id="cxl" y1="${mt}" y2="${mt+ph}" stroke="var(--mu)" stroke-dasharray="3 3"/><circle id="cxc" r="4.5" fill="var(--s1)" stroke="${lc}" stroke-width="2.5"/></g></g>`;
  s+=tag(Y(tool.tp),usd(tool.tp),'var(--up)')+tag(Y(tool.sl),usd(tool.sl),'var(--dn)');
  if(tool.live)s+=tag(yE,usd(tool.en),'#5b6776');
  s+=tag(Y(p),usd(p),'var(--ac)').replace('class="tg"','class="tg" style="fill:#04201d"')+`</svg>`;
  box.innerHTML=s;
  const tip=$('#tip'),svg=$('#ch'),rest=()=>{tip.innerHTML=`<b style="color:var(--tx)">${usd(p)}</b> · ${t('today')}`};rest();
  const mv=e=>{
    const b=svg.getBoundingClientRect(),x=cl((e.clientX-b.left)/b.width*Wd,ml,ml+pw),i=Math.round((x-ml)/pw*TT),xp=X(i);
    $('#cx').setAttribute('visibility','visible');$('#cxl').setAttribute('x1',xp);$('#cxl').setAttribute('x2',xp);
    if(i<=N-1){$('#cxc').setAttribute('cx',xp);$('#cxc').setAttribute('cy',Y(v[i]));tip.innerHTML=`<b style="color:var(--tx)">${usd(v[i])}</b> · ${dOf(i).toLocaleDateString(L,{day:'numeric',month:'short'})} · ${pc((v[i]/v[0]-1)*100)}`}
    else{const k=i-(N-1);$('#cxc').setAttribute('cx',xp);$('#cxc').setAttribute('cy',Y(p));tip.innerHTML=`${t('proj_d')} ${dOf(i).toLocaleDateString(L,{day:'numeric',month:'short'})} (±1σ) : <b style="color:var(--tx)">${usd(p*Math.exp(-sgm*Math.sqrt(k)))} – ${usd(p*Math.exp(sgm*Math.sqrt(k)))}</b>`}
  };
  svg.addEventListener('pointermove',mv);svg.addEventListener('pointerdown',mv);
  svg.addEventListener('pointerleave',()=>{$('#cx').setAttribute('visibility','hidden');rest()});
}

/* ═════════ Accueil (capital de départ) ═════════ */
function welcome(){
  const dg=$('#wd');let cap=1000,st='USDT';
  dg.innerHTML=`<h2>${t('w_title')}</h2><p class="mu" style="margin:0">${t('w_txt')}</p>
   <div class="lab"><span>${t('w_cap')}</span></div>
   <div class="chips">${[500,1000,5000,10000,50000,100000].map(n=>`<button data-cap="${n}" aria-pressed="${n===cap}">${nf(n,0)}</button>`).join('')}</div>
   <label class="inp" style="margin-top:8px"><input id="cap" type="number" inputmode="decimal" min="10" step="any" value="${cap}" aria-label="${t('w_cap')}"><span class="st">$</span></label>
   <div class="lab"><span>${t('w_st')}</span></div>
   <div class="chips" style="grid-template-columns:1fr 1fr">${['USDT','USDC'].map(u=>`<button data-st="${u}" aria-pressed="${u===st}">${u}</button>`).join('')}</div>
   <button class="go" id="go">${t('w_go')}</button>`;
  dg.oncancel=e=>e.preventDefault();
  dg.onclick=e=>{
    const c=e.target.closest('[data-cap]'),u=e.target.closest('[data-st]');
    if(c){cap=+c.dataset.cap;$('#cap').value=cap;dg.querySelectorAll('[data-cap]').forEach(b=>b.setAttribute('aria-pressed',b===c))}
    if(u){st=u.dataset.st;dg.querySelectorAll('[data-st]').forEach(b=>b.setAttribute('aria-pressed',b===u))}
    if(e.target.id==='go'){
      const v=parseFloat($('#cap').value);if(!(v>=MIN)){$('#cap').focus();return}
      W={cap0:v,cash:v,st,pos:[],hist:[],t0:Date.now()};saveW();dg.close();start();
    }
  };
  $('#cap').oninput=()=>dg.querySelectorAll('[data-cap]').forEach(b=>b.setAttribute('aria-pressed',false));
  dg.showModal();
}

/* ═════════ Interactions ═════════ */
document.addEventListener('click',e=>{
  const g=k=>e.target.closest(`[${k}]`);let b;
  if(b=g('data-sell')){e.stopPropagation();const p=W.pos.find(x=>x.id===b.dataset.sell);if(p){const h=closePos(p,price(p.sym),'manual');saveW();toast(t('okM').replace('{s}',p.sym).replace('{v}',money(h.pnl)));full()}return}
  if(b=g('data-pid')){const p=W.pos.find(x=>x.id===b.dataset.pid);if(p){S.sym=p.sym;S.focus=p.id;coins();head();upd(true);posList();$('#cbox').scrollIntoView({behavior:'smooth',block:'center'})}return}
  if(b=g('data-sym')){S.sym=b.dataset.sym;S.focus=null;coins();head();upd(true);posList();return}
  if(b=g('data-p')){S.prof=b.dataset.p;S.focus=null;upd(true);posList();return}
  if(b=g('data-pct')){const n=+b.dataset.pct;S.amt=n===100?String(Math.floor(W.cash*100)/100):String(Math.floor(W.cash*n)/100);$('#am').value=S.amt;S.focus=null;upd(true);return}
  if(b=g('data-buy')){buy();return}
  if(b=g('data-rg')){S.rg=+b.dataset.rg;head();chart();return}
  if(b=g('data-proj')){S.proj=!S.proj;head();chart();return}
  if(b=g('data-tab')){S.tab=b.dataset.tab;posList();return}
  if(b=g('data-l')){L=b.dataset.l;store.set('lang',L);shell();return}
  if(b=g('data-th')){const n=document.documentElement.dataset.theme==='light'?'dark':'light';document.documentElement.dataset.theme=n;store.set('theme',n);document.querySelector('meta[name=theme-color]').content=n==='light'?'#f3f5f4':'#0a0e13';chart();return}
  if(b=g('data-reset')){if(confirm(t('reset_c'))){store.del(KEY);W=null;S.focus=null;S.amt='';welcome()}return}
});

/* ═════════ Démarrage ═════════ */
async function refresh(){
  await loadLive();
  if(!W)return;
  const hit=evalAll();
  wallet();coins();head();posList();upd(true);
  if(hit)full();
}
function start(){
  if(!S.sym||!coin(S.sym))S.sym=S.sc.top5[0];
  shell();
  if(evalAll())full();                              // positions touchées pendant l'absence
}
async function init(){
  try{S.sc=await j('data/model/latest_scores.json')}catch(e){$('#app').innerHTML=`<p class="dn" style="margin-top:30px;font-weight:600">${t('err')}</p>`;return}
  try{S.det=await j('data/model/detail.json')}catch(e){}
  await loadLive();loadW();
  if(!W){S.sym=S.sc.top5[0];shell_empty();welcome();return}
  start();
}
function shell_empty(){$('#app').innerHTML=`<div class="sk"></div><div class="sk" style="height:320px"></div>`}
setInterval(refresh,60000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)refresh()});
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
init();
</script>
</body>
</html>
