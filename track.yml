name: Suivi de fiabilite

# Tous les jours, apres le pipeline quotidien (01h17 UTC).
on:
  schedule:
    - cron: "40 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  suivi:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Calculer la note de fiabilite
        run: python scripts/track_record.py data
      - name: Enregistrer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/track
          git diff --staged --quiet || git commit -m "Suivi de fiabilite"
          git pull --rebase
          git push
