<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Altracker — Top 100 Scout</title>
<meta name="description" content="Classement des altcoins du top 100 par un modèle statistique.">
<meta name="theme-color" content="#0a0e13">
<meta name="color-scheme" content="dark light">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Altracker">
<script>
// Thème appliqué avant le premier rendu (évite le flash blanc)
(function(){try{var th=localStorage.getItem('theme')||(matchMedia('(prefers-color-scheme: light)').matches?'light':'dark');document.documentElement.dataset.theme=th;var m=document.querySelector('meta[name=theme-color]');if(m)m.content=th==='light'?'#f3f5f4':'#0a0e13'}catch(e){}})();
</script>
<style>
:root,[data-theme=dark]{color-scheme:dark;--bg:#0a0e13;--s1:#111820;--s2:#18212b;--bd:#232d39;--tx:#e8edf2;--mu:#8a97a6;--ac:#2dd4bf;--up:#34d399;--dn:#f87171;--wa:#fbbf24;--sh:0 8px 30px #0008}
[data-theme=light]{color-scheme:light;--bg:#f3f5f4;--s1:#fff;--s2:#eef1ef;--bd:#dde2de;--tx:#12171c;--mu:#5f6b76;--ac:#0b8a82;--up:#16794a;--dn:#b42318;--wa:#9a5b0a;--sh:0 8px 30px #0003}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overscroll-behavior-y:contain;padding-top:env(safe-area-inset-top)}
button,a{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.mu{color:var(--mu)}.up{color:var(--up)}.dn{color:var(--dn)}.err{color:var(--dn);font-weight:600}.s{font-size:13px}
h2{font:700 18px/1.2 system-ui;margin:0;letter-spacing:-.01em}
#app{max-width:760px;margin:0 auto;padding:0 14px calc(92px + env(safe-area-inset-bottom))}

/* ——— En-tête ——— */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:8px;padding:10px 14px;margin:0 -14px;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid transparent}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:19px;letter-spacing:-.02em;margin-right:auto}
.logo img{width:28px;height:28px;border-radius:8px}
.seg{display:flex;background:var(--s1);border:1px solid var(--bd);border-radius:10px;padding:2px}
.seg button{padding:3px 9px;border-radius:8px;font-size:12px;font-weight:700;color:var(--mu)}
.seg button[aria-pressed=true]{background:var(--ac);color:#04201d}
.ib{width:36px;height:36px;display:grid;place-items:center;border-radius:10px;background:var(--s1);border:1px solid var(--bd);color:var(--mu)}
.ib svg{width:18px;height:18px}
.spin svg{animation:sp .8s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
#ptr{position:fixed;top:calc(env(safe-area-inset-top) + 60px);left:50%;transform:translate(-50%,-80px);z-index:30;background:var(--s2);border:1px solid var(--bd);border-radius:20px;padding:6px 14px;font-size:12.5px;box-shadow:var(--sh);opacity:0;pointer-events:none}

/* ——— Bandeau d'infos ——— */
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 4px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--mu);background:var(--s1);border:1px solid var(--bd);border-radius:20px;padding:3px 10px}
.chip.w{color:var(--wa);border-color:color-mix(in srgb,var(--wa) 40%,var(--bd))}
.chip i{width:7px;height:7px;border-radius:50%;background:var(--up)}
.chip.w i{background:var(--wa)}
.disc{border-left:3px solid var(--wa);padding:4px 12px;margin:12px 0 0;font-size:12.5px;color:var(--mu)}
section{margin-top:26px}
.sh{display:flex;justify-content:space-between;align-items:baseline;gap:10px}

/* ——— Cartes marché ——— */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.card{background:var(--s1);border:1px solid var(--bd);border-radius:16px;padding:12px 14px;min-width:0}
.card.wide{grid-column:1/-1}
.ct{font-size:12.5px;font-weight:600;color:var(--mu)}
.cb{font:700 26px/1.2 system-ui;font-variant-numeric:tabular-nums;margin-top:2px}
.cb small{font-size:12.5px;font-weight:600;margin-left:6px}
.card p{margin:6px 0 0;font-size:12px;color:var(--mu);line-height:1.4}
.gauge{display:block;width:100%;max-width:260px;margin:0 auto}
.gv{font:800 38px system-ui;fill:var(--tx)}
.glab{text-align:center;font-weight:700;margin-top:-6px}
.trk{position:relative;height:10px;border-radius:5px;margin:14px 0 6px;background:linear-gradient(90deg,#f97316,#eab308 50%,#22c55e)}
.trk b{position:absolute;top:50%;width:16px;height:16px;border-radius:50%;background:var(--s1);border:3px solid var(--tx);transform:translate(-50%,-50%)}
.trk u{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--bg);opacity:.9}
.sp{display:block;width:100%;height:36px;margin-top:6px}

/* ——— Top 5 ——— */
.car{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;margin:10px -14px 0;padding:2px 14px 6px;scrollbar-width:none}
.car::-webkit-scrollbar{display:none}
.tc{flex:0 0 150px;scroll-snap-align:start;text-align:left;background:var(--s1);border:1px solid var(--bd);border-radius:18px;padding:12px;position:relative;overflow:hidden}
.tc:active{transform:scale(.98)}
.tc .rk{position:absolute;top:10px;right:12px;font-size:12px;font-weight:700;color:var(--mu)}
.tc b.sy{display:block;font-size:17px;margin-top:8px}
.tc .nm{font-size:12px;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tc .pr{font-weight:700;margin-top:6px;font-variant-numeric:tabular-nums}
.ring{display:block}.rt{font-weight:800;fill:var(--tx)}

/* ——— Variations 24 h ——— */
.mv{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.mv ul{list-style:none;margin:0;padding:0;background:var(--s1);border:1px solid var(--bd);border-radius:16px;overflow:hidden}
.mv li{display:flex;justify-content:space-between;padding:9px 12px;border-bottom:1px solid var(--bd);cursor:pointer;font-variant-numeric:tabular-nums}
.mv li:last-child{border:0}
.mv li:active{background:var(--s2)}

/* ——— Carte thermique ——— */
.pills{display:flex;gap:6px}
.pill{padding:3px 11px;border-radius:20px;font-size:12.5px;font-weight:600;color:var(--mu);border:1px solid var(--bd);background:var(--s1)}
.pill[aria-pressed=true]{background:var(--ac);border-color:var(--ac);color:#04201d}
.heat{display:grid;grid-template-columns:repeat(auto-fill,minmax(62px,1fr));gap:4px;margin-top:10px}
.tile{aspect-ratio:1;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;border:1px solid color-mix(in srgb,var(--bd) 60%,transparent);color:var(--tx);min-width:0}
.tile b{font-size:12.5px}.tile small{font-size:10.5px;opacity:.85;font-variant-numeric:tabular-nums}
.tile.dim{opacity:.55}
.tile:active{transform:scale(.94)}

/* ——— Liste ——— */
.tools{display:flex;flex-direction:column;gap:10px;margin:12px 0 0}
.search{display:flex;align-items:center;gap:8px;background:var(--s1);border:1px solid var(--bd);border-radius:12px;padding:0 12px}
.search svg{width:16px;height:16px;color:var(--mu);flex:none}
.search input{flex:1;min-width:0;background:none;border:0;color:var(--tx);font:inherit;padding:10px 0}
.search input:focus-visible{outline:0}
.srt{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;align-items:center}
.srt::-webkit-scrollbar{display:none}
.srt .pill{white-space:nowrap;flex:none}
.sw{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mu);white-space:nowrap;flex:none;margin-left:auto}
.sw input{accent-color:var(--ac);width:16px;height:16px}
.rl{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:8px}
.row{display:grid;grid-template-columns:22px 40px minmax(0,1fr) 70px auto 34px;gap:10px;align-items:center;background:var(--s1);border:1px solid var(--bd);border-radius:16px;padding:9px 10px 9px 12px;cursor:pointer}
.row:active{background:var(--s2)}
.row .rk{font-size:12px;color:var(--mu);text-align:right;font-variant-numeric:tabular-nums}
.row .who{min-width:0}.row .who b{display:block}
.row .who span{display:block;font-size:12px;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .pr{text-align:right;font-variant-numeric:tabular-nums}
.row .pr b{display:block}.row .pr small{font-size:12px}
.row .low{font-size:10.5px;color:var(--wa);margin-left:4px;font-weight:600}
.st{width:34px;height:34px;display:grid;place-items:center;color:var(--mu);border-radius:50%}
.st svg{width:19px;height:19px}
.st[aria-pressed=true]{color:var(--wa)}.st[aria-pressed=true] svg{fill:currentColor}
.more{text-align:center;margin:12px 0 0}.more button{border:1px solid var(--bd);background:var(--s1);border-radius:20px;padding:7px 20px;font-size:13.5px}
.empty{text-align:center;color:var(--mu);padding:36px 10px;background:var(--s1);border:1px dashed var(--bd);border-radius:16px}
@media(max-width:430px){.row{grid-template-columns:40px minmax(0,1fr) 54px auto 30px;gap:8px;padding-left:10px}.row .rk{display:none}.row .sp2 svg{width:54px}}

/* ——— Barre du bas ——— */
nav{position:fixed;left:0;right:0;bottom:0;z-index:25;display:flex;justify-content:center;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom)}
nav .in{display:flex;width:100%;max-width:760px}
nav button,nav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 7px;font-size:11px;font-weight:600;color:var(--mu);text-decoration:none}
nav svg{width:22px;height:22px}
nav [aria-current=page]{color:var(--ac)}

/* ——— Fiche détail (bottom sheet) ——— */
dialog{border:0;padding:0;background:var(--s1);color:var(--tx);width:100%;max-width:640px;max-height:92vh;max-height:92dvh;margin:auto auto 0;border-radius:24px 24px 0 0;box-shadow:var(--sh);overflow:hidden}
dialog[open]{animation:up .28s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column}
dialog::backdrop{background:#0009;backdrop-filter:blur(2px);animation:fd .2s}
@keyframes up{from{transform:translateY(40px);opacity:0}}@keyframes fd{from{opacity:0}}
@media(min-width:700px){dialog{margin:auto;border-radius:24px;max-height:86vh}}
.grab{width:40px;height:4px;border-radius:2px;background:var(--bd);margin:8px auto 0;flex:none}
.sb{overflow-y:auto;padding:12px 18px calc(20px + env(safe-area-inset-bottom));overscroll-behavior:contain}
.dh{display:flex;align-items:center;gap:12px}
.dh h3{margin:0;font-size:22px;line-height:1.1}.dh .grow{flex:1;min-width:0}
.px{font:800 28px system-ui;font-variant-numeric:tabular-nums;margin-top:12px}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:2px 10px;border-radius:20px;border:1px solid currentColor;margin-left:8px;vertical-align:middle}
.tip{font-size:13px;color:var(--mu);min-height:20px;font-variant-numeric:tabular-nums}
#ch{display:block;width:100%;height:auto;touch-action:pan-y;cursor:crosshair;margin-top:4px}
.ctl{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:6px;flex-wrap:wrap}
.lg{display:flex;gap:6px}
.lg button{font-size:12px;font-weight:600;color:var(--mu);border:1px solid var(--bd);border-radius:20px;padding:2px 9px;display:flex;align-items:center;gap:5px}
.lg button i{width:10px;height:3px;border-radius:2px;background:var(--c)}
.lg button[aria-pressed=false]{opacity:.45}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:14px}
.stat{background:var(--s2);border-radius:12px;padding:8px 12px;display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:13.5px;font-variant-numeric:tabular-nums}
.stat span:first-child{color:var(--mu);font-size:12.5px}
.rsi{margin-top:14px}
.rsi .trk{background:linear-gradient(90deg,#22c55e 0 30%,var(--bd) 30% 70%,#ef4444 70%);margin:10px 0 4px;opacity:.9}
.rsi .lab{display:flex;justify-content:space-between;font-size:11px;color:var(--mu)}
h4{margin:20px 0 2px;font-size:15px}
.ev{display:grid;grid-template-columns:minmax(90px,130px) 1fr 44px;gap:8px;align-items:center;font-size:13px;margin-top:8px}
.ev div{position:relative;height:8px;background:var(--s2);border-radius:4px}
.ev div:before{content:"";position:absolute;left:50%;top:-2px;bottom:-2px;width:1px;background:var(--bd)}
.ev i{position:absolute;top:0;height:100%;border-radius:4px}.ev .p{background:var(--up)}.ev .n{background:var(--dn)}
.ev b{text-align:right;font-variant-numeric:tabular-nums}

/* ——— Divers ——— */
#toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:var(--tx);color:var(--bg);padding:8px 16px;border-radius:20px;font-size:13px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:60;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
.ios{display:flex;gap:10px;align-items:center;background:var(--s1);border:1px solid var(--bd);border-radius:14px;padding:10px 12px;margin-top:12px;font-size:13px}
.ios button{margin-left:auto;color:var(--mu);font-size:20px;line-height:1}
footer{margin-top:34px;font-size:12px;color:var(--mu);text-align:center}
.sk{height:84px;border-radius:16px;margin-top:10px;background:linear-gradient(90deg,var(--s1),var(--s2),var(--s1));background-size:200% 100%;animation:sk 1.3s infinite}@keyframes sk{to{background-position:-200% 0}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* ═════ AJOUT : reco n°1 + 3 indicateurs + top 5 égal ═════ */
.hero{background:linear-gradient(135deg,color-mix(in srgb,var(--ac) 14%,var(--s1)),var(--s1) 62%);border:1px solid color-mix(in srgb,var(--ac) 45%,var(--bd));border-radius:20px;padding:14px;cursor:pointer}
.hero:active{transform:scale(.995)}
.hero .kick{font-size:12.5px;font-weight:700;color:var(--ac)}
.hh{display:flex;align-items:center;gap:12px;margin-top:8px}
.hh .grow{flex:1;min-width:0}.hh h3{margin:0;font-size:24px;line-height:1.1}
.hp{display:flex;align-items:center;gap:4px}.hpx{font:800 22px system-ui;font-variant-numeric:tabular-nums}
.hg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:12px}
.hg div{background:var(--s2);border-radius:12px;padding:6px 8px;font-size:13px;font-variant-numeric:tabular-nums;min-width:0}
.hg span{display:block;font-size:11px;color:var(--mu)}
.hw{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:12px;align-items:center}
.hw ul{margin:0;padding:0;list-style:none;font-size:13px}.hw li{display:flex;justify-content:space-between;gap:8px;padding:2px 0}
.hw .ct{margin-bottom:2px}
.hero .sp{height:44px}
.hero .note{margin:10px 0 0;font-size:12px;color:var(--mu)}
.hero .go{margin-top:6px;font-size:13px;font-weight:700;color:var(--ac)}
.tri{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px}
.tri .card{display:flex;flex-direction:column;padding:10px 12px}
.tri .cb{font-size:22px}
.tri .card p{font-size:11.5px}
.tri .trk{margin:12px 0 6px}
.tri .push{margin-top:auto}
.mcb{position:relative;height:10px;border-radius:5px;background:var(--s2);overflow:hidden;margin-top:12px}
.mcb i{display:block;height:100%;background:var(--ac);border-radius:5px}
.mcl{display:flex;justify-content:space-between;gap:6px;font-size:11.5px;color:var(--mu);margin-top:4px}
.car{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;overflow:visible;margin:10px 0 0;padding:0}
.tc{flex:none;min-width:0;text-align:center;padding:10px 8px}
.tc .ring{display:block;margin:0 auto;width:100%;max-width:52px;height:auto}
.tc svg:not(.ring){display:block;width:100%;height:24px;margin-top:4px}
.tc b.sy{font-size:15px}
@media(max-width:520px){
 .tri{gap:6px}.tri .card{padding:9px 8px}.tri .cb{font-size:17px}.tri .ct{font-size:11px}
 .tri .card p{display:none}.tri .cb small{display:block;margin:0;font-size:11px}
 .car{gap:5px}.tc{padding:8px 4px;border-radius:14px}.tc .rk,.tc .nm{display:none}
 .tc b.sy{font-size:13px;margin-top:6px}.tc .pr{font-size:11px}.tc .s{font-size:10.5px}
 .hg{grid-template-columns:repeat(2,minmax(0,1fr))}.hw{grid-template-columns:1fr}
}
</style>
</head>

async function j(u){
  for(const x of u.startsWith('http')?[u]:[u,RAW+u]){
    try{const r=await fetch(x,{cache:'no-store'});if(r.ok)return await r.json()}catch(e){}
  }
  throw new Error(u);
}
async function load(manual){
  S.busy=true;spin();

  try{S.live=await j('https://raw.githubusercontent.com/NalistPro/Altracker/live/live.json');S.px={};S.live.coins.forEach(c=>S.px[c.symbole]=c)}catch(e){S.live=null}
  try{S.mk=await j('data/model/market.json')}catch(e){}
  try{S.det=await j('data/model/detail.json')}catch(e){}

/* ═════════ Briques graphiques ═════════ */
const pth=(v,w,h,lo,hi)=>v.map((y,i)=>(i?'L':'M')+(i/(v.length-1||1)*w).toFixed(1)+' '+(h-(y-lo)/((hi-lo)||1)*h).toFixed(1)).join('');
function ring(s,z=44,w=4){
  const r=(z-w)/2,C=2*Math.PI*r,h=z/2;
  return `<svg class="ring" width="${z}" height="${z}" viewBox="0 0 ${z} ${z}" aria-hidden="true"><circle cx="${h}" cy="${h}" r="${r}" fill="none" stroke="var(--bd)" stroke-width="${w}"/><circle cx="${h}" cy="${h}" r="${r}" fill="none" stroke="${col(s)}" stroke-width="${w}" stroke-linecap="round" stroke-dasharray="${(C*s/100).toFixed(1)} ${C.toFixed(1)}" transform="rotate(-90 ${h} ${h})"/><text x="50%" y="50%" text-anchor="middle" dominant-baseline="central" class="rt" style="font-size:${(z*.34).toFixed(1)}px">${s}</text></svg>`;
}
function mini(v,w=70,h=26,cls=''){
  if(!v||v.length<2)return '';
  const lo=Math.min(...v),hi=Math.max(...v),up=v[v.length-1]>=v[0],c=up?'var(--up)':'var(--dn)';
  return `<svg class="${cls}" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" preserveAspectRatio="none" aria-hidden="true"><path transform="translate(0 2)" d="${pth(v,w,h-4,lo,hi)}" fill="none" stroke="${c}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/></svg>`;
}
function spark(s,lo,hi,g){
  const v=s.map(x=>x[1]),Y=y=>(34-(y-lo)/((hi-lo)||1)*34).toFixed(1);
  return `<svg class="sp" viewBox="0 0 300 36" preserveAspectRatio="none" aria-hidden="true">${(g||[]).map(y=>`<line x1="0" x2="300" y1="${Y(y)}" y2="${Y(y)}" stroke="var(--bd)" stroke-dasharray="3 3"/>`).join('')}<path d="${pth(v,300,34,lo,hi)}" fill="none" stroke="var(--ac)" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>`;
}
function gauge(v){
  const cx=100,cy=100,r=80,P=a=>[cx+r*Math.cos(a),cy-r*Math.sin(a)];
  const seg=[[0,25,'#ef4444'],[25,45,'#f97316'],[45,55,'#eab308'],[55,75,'#84cc16'],[75,100,'#22c55e']];
  const arc=(a,b)=>{const p=P(Math.PI*(1-a/100)),q=P(Math.PI*(1-b/100));return `M${p[0].toFixed(1)} ${p[1].toFixed(1)}A${r} ${r} 0 0 1 ${q[0].toFixed(1)} ${q[1].toFixed(1)}`};
  const n=P(Math.PI*(1-Math.max(0,Math.min(100,v))/100));
  return `<svg viewBox="0 0 200 112" class="gauge" aria-hidden="true">${seg.map(s=>`<path d="${arc(s[0]+.7,s[1]-.7)}" stroke="${s[2]}" stroke-width="14" fill="none"/>`).join('')}<circle cx="${n[0].toFixed(1)}" cy="${n[1].toFixed(1)}" r="9" fill="var(--s1)" stroke="var(--tx)" stroke-width="3"/><text x="100" y="92" text-anchor="middle" class="gv">${v}</text></svg>`;
}
const sma=(v,n)=>v.map((_,i)=>i<n-1?null:v.slice(i-n+1,i+1).reduce((a,b)=>a+b,0)/n);
const topList=()=>S.sc.top5.map(s=>S.sc.classement.find(c=>c.symbole===s)).filter(Boolean);

  rankList(favOnly);
}
function rankList(favOnly){
  const q=favOnly?'':S.q.trim().toLowerCase(),k=S.sort;
  let rows=S.sc.classement.filter(c=>(favOnly?S.fav.has(c.symbole):true)&&(!S.liq||c.liquide||favOnly)&&(!q||c.symbole.toLowerCase().includes(q)||c.nom.toLowerCase().includes(q)));
  if(k!=='score')rows=rows.slice().sort((a,b)=>(val(b,k)??-1e18)-(val(a,k)??-1e18));
  const lim=S.more||q||favOnly?rows.length:20,mr=$('#mr');
  mr.hidden=!!q||favOnly||rows.length<=20;mr.textContent=S.more?t('less'):`${t('more')} (${rows.length-20})`;
  const pk=['d1','d7','d30'].includes(k)?k:'d7';
  $('#rl').innerHTML=rows.length?rows.slice(0,lim).map(c=>`<li class="row" data-s="${esc(c.symbole)}"><span class="rk">${c.rang}</span>${ring(c.score,40,4)}
   <div class="who"><b>${esc(c.symbole)}${c.liquide?'':`<span class="low">${t('low')}</span>`}</b><span>${esc(c.nom)}</span></div>
   <div class="sp2">${mini(last30(c.symbole),70,26)}</div>
   <div class="pr"><b>${usd(price(c))}</b><small>${pc(val(c,pk))} <span class="mu">${t(pk)}</span></small></div>${star(c.symbole)}</li>`).join('')
   :`<li class="empty">${favOnly?t('fav0'):t('none')}</li>`;
}

/* ——— Fiche détail ——— */
function fiche(sym){
  const c=S.sc.classement.find(x=>x.symbole===sym);if(!c)return;
  S.sel=sym;
  const d=S.det&&S.det.coins[sym],dg=$('#dg');
  let trend='',rsi='',stats='',ev='';
  if(d){
    const v=d.c,Lc=v[v.length-1],[a20,a50,a100]=[20,50,100].map(n=>{const s=sma(v,n);return s[s.length-1]});
    const tr=Lc>a20&&Lc>a50&&a20>a50?['up',t('tu')]:Lc<a20&&Lc<a50&&Lc<a100?['dn',t('td')]:['mu',t('tn')];
    trend=`<span class="tag ${tr[0]}">${tr[1]}</span>`;
    const i=d.i,E=x=>x==null?null:Math.expm1(x)*100,Q=x=>x==null?null:x*100;
    const rows=[['i7',E(i.ret7)],['i30',E(i.ret30)],['i90',E(i.ret90)],['ih90',Q(i.dd90)],['ih365',Q(i.dd365)],['iath',Q(i.dd_ath)],['ivol',E(i.vol_rel)]];
    stats=`<div class="stats">${rows.map(r=>`<div class="stat"><span>${t(r[0])}</span><b>${pc(r[1])}</b></div>`).join('')}</div>`;
    if(i.rsi14!=null)rsi=`<div class="rsi"><div class="ct">${t('rsi')} · <b style="color:var(--tx)">${nf(i.rsi14,0)}</b></div><div class="trk"><b style="left:${Math.max(2,Math.min(98,i.rsi14))}%"></b></div><div class="lab"><span>0 · ${t('ov')}</span><span>${t('ob')} · 100</span></div></div>`;
    const mx=Math.max(...d.e.map(x=>Math.abs(x[1])),1);
    ev=`<h4>${t('why')}</h4><p class="mu s" style="margin:0">${t('why_n')}</p>`+d.e.map(x=>`<div class="ev"><span>${t('g_'+x[0])}</span><div><i class="${x[1]>=0?'p':'n'}" style="width:${Math.abs(x[1])/mx*50}%;${x[1]>=0?'left':'right'}:50%"></i></div><b class="${x[1]>=0?'up':'dn'}">${x[1]>0?'+':''}${nf(x[1],1)}</b></div>`).join('');
  }
  dg.innerHTML=`<div class="grab"></div><div class="sb">
    <div class="dh">${ring(c.score,64,6)}<div class="grow"><h3>${esc(sym)}${trend}</h3><span class="mu s">#${c.rang} · ${esc(c.nom)}</span></div>${star(sym)}<button class="ib" data-x aria-label="${t('cl')}" style="font-size:22px;line-height:1">×</button></div>
    <div class="px">${usd(price(c))}</div>
    <div id="chw"></div>${stats}${rsi}${ev}</div>`;
  if(!dg.open){dg.showModal();history.pushState({sheet:1},'');S.pushed=true}
  dg.querySelector('.sb').scrollTop=0;
  if(d)drawChart();
}
function drawChart(){
  const d=S.det.coins[S.sel],v=d.c,N=Math.max(2,Math.min(S.rg||v.length,v.length)),o=v.length-N,W=600,H=210;
  const w=v.slice(o),lo=Math.min(...w)*.98,hi=Math.max(...w)*1.02,Y=y=>H-(y-lo)/((hi-lo)||1)*H;
  const P=a=>{let s='',k=0;a.slice(o).forEach((y,i)=>{if(y==null)return;s+=(k?'L':'M')+(i/(N-1)*W).toFixed(1)+' '+Y(y).toFixed(1);k=1});return s};
  const up=w[N-1]>=w[0],c=up?'var(--up)':'var(--dn)',line=P(v);
  const MA={20:'#fb923c',50:'#2dd4bf',100:'#a78bfa'};
  const rg=[[30,'30'+t('d7').slice(-1)],[90,'90'+t('d7').slice(-1)],[180,'180'+t('d7').slice(-1)],[0,t('mx')]];
  $('#chw').innerHTML=`<div class="tip" id="tip"></div>
   <svg id="ch" viewBox="0 0 ${W} ${H}" aria-hidden="true"><defs><linearGradient id="ar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${up?'#34d399':'#f87171'}" stop-opacity=".35"/><stop offset="1" stop-color="${up?'#34d399':'#f87171'}" stop-opacity="0"/></linearGradient></defs>
    <path d="${line} L${W} ${H} L0 ${H}Z" fill="url(#ar)"/>
    ${[20,50,100].filter(n=>S.ma[n]).map(n=>`<path d="${P(sma(v,n))}" fill="none" stroke="${MA[n]}" stroke-width="1.5" vector-effect="non-scaling-stroke"/>`).join('')}
    <path d="${line}" fill="none" stroke="${c}" stroke-width="2.2" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
    <g id="cx" visibility="hidden"><line id="cxl" y1="0" y2="${H}" stroke="var(--mu)" stroke-dasharray="3 3" vector-effect="non-scaling-stroke"/><circle id="cxc" r="5" fill="var(--s1)" stroke="${c}" stroke-width="2.5" vector-effect="non-scaling-stroke"/></g></svg>
   <div class="ctl"><div class="pills">${rg.map(r=>`<button class="pill" data-rg="${r[0]}" aria-pressed="${(S.rg||0)===r[0]}">${r[1]}</button>`).join('')}</div>
    <div class="lg">${[20,50,100].map(n=>`<button data-ma="${n}" aria-pressed="${S.ma[n]}" style="--c:${MA[n]}"><i></i>${n}</button>`).join('')}</div></div>`;
  const tip=$('#tip'),svg=$('#ch');
  const show=i=>{
    const ch=(w[i]/w[0]-1)*100;
    tip.innerHTML=`<b style="color:var(--tx)">${usd(w[i])}</b> · ${i===N-1?t('today'):t('ago')+(N-1-i)} · ${pc(ch)}`;
  };
  show(N-1);
  const mv=e=>{
    const b=svg.getBoundingClientRect(),x=Math.max(0,Math.min(1,(e.clientX-b.left)/b.width)),i=Math.round(x*(N-1)),px=i/(N-1)*W;
    $('#cx').setAttribute('visibility','visible');
    $('#cxl').setAttribute('x1',px);$('#cxl').setAttribute('x2',px);
    $('#cxc').setAttribute('cx',px);$('#cxc').setAttribute('cy',Y(w[i]));
    show(i);
  };
  svg.addEventListener('pointermove',mv);svg.addEventListener('pointerdown',mv);
  svg.addEventListener('pointerleave',()=>{$('#cx').setAttribute('visibility','hidden');show(N-1)});
}

/* ═════════ Interactions ═════════ */
document.addEventListener('click',e=>{
  const g=k=>e.target.closest(`[${k}]`);
  let b;
  if(b=g('data-f')){e.stopPropagation();const s=b.dataset.f;S.fav.has(s)?S.fav.delete(s):S.fav.add(s);store.set('fav',JSON.stringify([...S.fav]));
    document.querySelectorAll(`[data-f="${CSS.escape(s)}"]`).forEach(x=>{x.setAttribute('aria-pressed',S.fav.has(s))});
    if(S.tab==='fav'&&!$('#dg').open)view();return}
  if(b=g('data-x')){$('#dg').close();return}
  if(b=g('data-l')){L=b.dataset.l;store.set('lang',L);shell();return}
  if(b=g('data-tab')){S.tab=b.dataset.tab;view();scrollTo({top:0});return}
  if(b=g('data-th')){const n=document.documentElement.dataset.theme==='light'?'dark':'light';document.documentElement.dataset.theme=n;store.set('theme',n);document.querySelector('meta[name=theme-color]').content=n==='light'?'#f3f5f4':'#0a0e13';return}
  if(b=g('data-rf')){load(true);return}
  if(b=g('data-inst')){if(dip){dip.prompt();dip.userChoice.finally(()=>{dip=null;$('#inst').hidden=true})}return}
  if(b=g('data-hide')){store.set('iosHint','1');b.closest('.ios').remove();return}
  if(b=g('data-hp')){S.hp=b.dataset.hp;home();return}
  if(b=g('data-sort')){S.sort=b.dataset.sort;rank(S.tab==='fav');return}
  if(b=g('data-more')){S.more=!S.more;rankList(S.tab==='fav');return}
  if(b=g('data-rg')){S.rg=+b.dataset.rg;drawChart();return}
  if(b=g('data-ma')){S.ma[b.dataset.ma]=!S.ma[b.dataset.ma];drawChart();return}
  if(b=g('data-s')){fiche(b.dataset.s);return}
  if(e.target.id==='dg')$('#dg').close();
});
/* Bouton « retour » du téléphone = ferme la fiche */
document.addEventListener('close',e=>{if(e.target.id!=='dg')return;if(S.pushed){S.pushed=false;history.back()}if(S.tab==='fav')view()},true);
addEventListener('popstate',()=>{const d=$('#dg');if(d&&d.open){S.pushed=false;d.close()}});

/* Tirer pour actualiser */
(function(){
  let y0=null,dy=0;const p=$('#ptr');
  addEventListener('touchstart',e=>{y0=(scrollY<=0&&!$('#dg')?.open&&e.touches.length===1)?e.touches[0].clientY:null;dy=0},{passive:true});
  addEventListener('touchmove',e=>{if(y0==null)return;dy=e.touches[0].clientY-y0;
    if(dy>8){p.textContent=dy>90?t('ptr'):t('ptr0');p.style.opacity=Math.min(1,dy/70);p.style.transform=`translate(-50%,${Math.min(dy,110)-80}px)`}},{passive:true});
  addEventListener('touchend',()=>{if(y0==null)return;if(dy>90)load(true);p.style.opacity=0;p.style.transform='translate(-50%,-80px)';y0=null},{passive:true});
})();

/* Installation (Android / Chrome) */
addEventListener('beforeinstallprompt',e=>{e.preventDefault();dip=e;const b=$('#inst');if(b)b.hidden=false});
addEventListener('online',()=>{S.sc&&view();load()});
addEventListener('offline',()=>{S.sc&&view();toast(t('off'))});

/* Service worker : permet l'installation et le mode hors ligne */
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));

load();
/* ═════ AJOUT : reco n°1 + 3 indicateurs ═════ */
const N2={
fr:{rec:"Coin recommandé du moment",recn:"Meilleur score du modèle parmi les coins liquides. Outil d'étude, pas un conseil.",pts:"Ce qui le porte",mc:"Capitalisation crypto",mcn:"Valeur totale du marché crypto, comparée à son plus haut historique (ATH).",vath:"vs ATH",ath:"ATH",fiche:"Voir la fiche complète"},
es:{rec:"Moneda recomendada del momento",recn:"Mejor puntuación del modelo entre las monedas líquidas. Herramienta de estudio, no un consejo.",pts:"Lo que la impulsa",mc:"Capitalización cripto",mcn:"Valor total del mercado cripto, comparado con su máximo histórico (ATH).",vath:"vs ATH",ath:"ATH",fiche:"Ver la ficha completa"},
en:{rec:"Recommended coin right now",recn:"Highest model score among liquid coins. Research tool, not advice.",pts:"What drives it",mc:"Crypto market cap",mcn:"Total crypto market value, compared with its all-time high (ATH).",vath:"vs ATH",ath:"ATH",fiche:"Open full details"}};
for(const l in N2)Object.assign(T[l],N2[l]);

const MCAP_ATH=4.27e12; // ATH du 6 oct. 2025 (TradingView/CoinGecko). Si market.json fournit mcap.ath, la plus grande valeur gagne.
S.mc=null;
async function loadMcap(){
  const m=S.mk&&S.mk.mcap;
  if(m&&m.valeur){S.mc={v:m.valeur,ath:Math.max(m.ath||0,MCAP_ATH),serie:m.serie||null};return}
  try{
    const r=await fetch('https://api.coingecko.com/api/v3/global');
    const v=(await r.json()).data.total_market_cap.usd;
    if(v){S.mc={v,ath:MCAP_ATH,serie:null};store.set('mc',String(v))}
  }catch(e){const v=+store.get('mc','0');S.mc=v?{v,ath:MCAP_ATH,serie:null}:null}
}
const tril=v=>nf(v/1e12,2)+' T$';

function heroSection(){
  const c=topList()[0];if(!c)return '';
  const d=S.det&&S.det.coins[c.symbole],x=lv(c),sym=esc(c.symbole);
  let tag='',why='';
  if(d){
    const v=d.c,Lc=v[v.length-1],[a20,a50,a100]=[20,50,100].map(n=>{const s=sma(v,n);return s[s.length-1]});
    const tr=Lc>a20&&Lc>a50&&a20>a50?['up',t('tu')]:Lc<a20&&Lc<a50&&Lc<a100?['dn',t('td')]:['mu',t('tn')];
    tag=`<span class="tag ${tr[0]}">${tr[1]}</span>`;
    const pos=d.e.filter(e=>e[1]>0).sort((p,q)=>q[1]-p[1]).slice(0,3);
    if(pos.length)why=`<div><div class="ct">${t('pts')}</div><ul>${pos.map(e=>`<li><span>${t('g_'+e[0])}</span><b class="up">+${nf(e[1],1)}</b></li>`).join('')}</ul></div>`;
  }
  const sp=last30(c.symbole);
  return `<section style="margin-top:14px"><div class="hero" data-s="${sym}" role="button" tabindex="0" onkeydown="if(event.key==='Enter')this.click()">
   <div class="kick">★ ${t('rec')}</div>
   <div class="hh">${ring(c.score,64,6)}<div class="grow"><h3>${sym}${tag}</h3><span class="mu s">#${c.rang} · ${esc(c.nom)}</span></div><div class="hp"><span class="hpx">${usd(price(c))}</span>${star(c.symbole)}</div></div>
   <div class="hg"><div><span>${t('d1')}</span>${pc(x?x.var_24h:null)}</div><div><span>${t('d7')}</span>${pc(c['ret7_%'])}</div><div><span>${t('d30')}</span>${pc(c['ret30_%'])}</div><div><span>${t('vol')}</span>$${nf(c['volume_30j_Musd'],1)}M</div></div>
   <div class="hw">${sp?`<div>${mini(sp,160,44,'sp')}</div>`:''}${why}</div>
   <p class="note">${t('recn')}</p><div class="go">${t('fiche')} ›</div></div></section>`;
}
function mcCard(){
  const m=S.mc;
  if(!m)return `<div class="card"><div class="ct">${t('mc')}</div><div class="cb">–</div></div>`;
  const ath=Math.max(m.ath,m.v),p=m.v/ath*100;
  let g;
  if(m.serie&&m.serie.length>1){
    const s=m.serie.map(z=>z[1]),lo=Math.min(...s);
    g=`<svg class="sp push" viewBox="0 0 300 36" preserveAspectRatio="none" aria-hidden="true"><line x1="0" x2="300" y1="1" y2="1" stroke="var(--wa)" stroke-dasharray="4 3"/><path d="${pth(s,300,34,lo,ath)}" transform="translate(0 1)" fill="none" stroke="var(--ac)" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>`;
  }else g=`<div class="mcb push"><i style="width:${p.toFixed(1)}%"></i></div>`;
  return `<div class="card"><div class="ct">${t('mc')}</div><div class="cb">${tril(m.v)}<small>${pc(p-100)}</small></div>${g}<div class="mcl"><span>${t('vath')}</span><span>${t('ath')} ${tril(ath)}</span></div><p>${t('mcn')}</p></div>`;
}
function trioSection(){
  const m=S.mk||{},a=m.alt,v=m.volbtc;
  const al=a?`<div class="card"><div class="ct">${t('alt')}</div><div class="cb">${a.valeur} %<small class="mu">${t(a.valeur>=75?'a1':a.valeur<=25?'a2':'a3')}</small></div><div class="trk push"><u style="left:25%"></u><u style="left:75%"></u><b style="left:${Math.max(2,Math.min(98,a.valeur))}%"></b></div><p>${t('alt_n')}</p></div>`:'';
  const vo=v?`<div class="card"><div class="ct">${t('vb')}</div><div class="cb">${nf(v.valeur,0)} %<small class="mu">${t(v.valeur<35?'v1':v.valeur<60?'v2':'v3')}</small></div>${spark(v.serie,0,Math.max(100,...v.serie.map(y=>y[1])),[]).replace('class="sp"','class="sp push"')}<p>${t('vb_n')}</p></div>`:'';
  return `<div class="tri">${al}${mcCard()}${vo}</div>`;
}

/* Nouvel accueil : coin n°1, 3 cartes, top 5, variations, carte du marché, puis Humeur du marché */
function home(){
  if(!S.mcT||Date.now()-S.mcT>6e4){S.mcT=Date.now();loadMcap().then(()=>{if(S.tab==='home'&&$('#view'))home()})}
  $('#view').innerHTML=`${metaStrip()}<p class="mu s" style="margin:8px 0 0">${t('sub')}</p><p class="disc">${t('disc')}</p>
   ${heroSection()}${trioSection()}
   <section><h2>${t('top')}</h2><p class="mu s" style="margin:4px 0 0">${t('topn')}</p><div class="car">${topList().map(topCard).join('')}</div></section>
   ${movers()}${heatSection()}${moodSection()}${iosHint()}`;
}
