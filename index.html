<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Altracker — Top 100 Scout</title>
<style>
:root{color-scheme:light;--bg:#f3f4f1;--card:#fff;--tx:#12171c;--mu:#5f6b76;--bd:#dde1dc;--ac:#0b6e6e;--up:#16794a;--dn:#b42318;--wa:#9a5b0a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{max-width:880px;margin:0 auto;padding:20px 16px 48px}
header{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 16px;justify-content:space-between}
h1{font:700 30px/1.1 Georgia,"Times New Roman",serif;margin:0;letter-spacing:-.01em}
h2{font:700 20px/1.2 Georgia,serif;margin:36px 0 4px}
.sub{flex-basis:100%;margin:2px 0 0;color:var(--mu)}
.lang button{font:inherit;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:3px 11px;cursor:pointer}
.lang button:first-child{border-radius:6px 0 0 6px}.lang button:last-child{border-radius:0 6px 6px 0}
.lang button[aria-pressed=true]{background:var(--ac);border-color:var(--ac);color:#fff}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.disc{border-left:3px solid var(--wa);padding:6px 12px;margin:16px 0 8px;font-size:13.5px;color:var(--mu)}
.meta{display:flex;flex-wrap:wrap;gap:2px 18px;margin:0;font-size:13.5px;color:var(--mu)}
.mu{color:var(--mu)}.up{color:var(--up)}.dn{color:var(--dn)}.err{color:var(--dn);font-weight:600}
ol{list-style:none;margin:14px 0 0;padding:0;display:grid;gap:10px}
.pick{display:grid;grid-template-columns:76px 1fr auto;gap:14px;align-items:center;background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px 16px}
.sn{font:700 44px/1 Georgia,serif;font-variant-numeric:tabular-nums;color:var(--ac);text-align:right}
.bar{height:6px;background:var(--bd);border-radius:3px;margin-top:7px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac)}
.pp{text-align:right;font-variant-numeric:tabular-nums}.pp small{display:block;color:var(--mu);font-size:12.5px}
.tools{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;margin:12px 0}
input[type=search],input[type=number],select{font:inherit;background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:6px;padding:6px 9px}
.tw{overflow-x:auto;background:var(--card);border:1px solid var(--bd);border-radius:10px}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;white-space:nowrap}
th,td{padding:8px 12px;text-align:right;border-bottom:1px solid var(--bd)}
th:nth-child(-n+2),td:nth-child(-n+2){text-align:left}
th{font-weight:600;font-size:13px;color:var(--mu)}tr:last-child td{border-bottom:0}
.mb{display:inline-block;width:54px;height:6px;background:var(--bd);border-radius:3px;vertical-align:middle;margin-right:8px;overflow:hidden}.mb i{display:block;height:100%;background:var(--ac)}
.low{color:var(--wa);font-size:12.5px}
.box{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:14px 16px;margin-top:12px}
.box p{margin:6px 0 0}.warn{font-size:13px;color:var(--wa)}
.mk{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px;margin-top:12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px 14px}.card.wide{grid-column:1/-1}
.ct{font-weight:600;font-size:13.5px;color:var(--mu)}.cb{font:700 30px/1.2 Georgia,serif;margin:2px 0 6px;font-variant-numeric:tabular-nums}.cb span{font:600 13px system-ui;color:var(--ac);margin-left:10px}
.card p{margin:6px 0 0;font-size:12.5px;color:var(--mu)}
.cl{cursor:pointer}.cl:hover{background:color-mix(in srgb,var(--ac) 8%,transparent)}
dialog{width:min(680px,94vw);max-height:90vh;border:1px solid var(--bd);border-radius:12px;background:var(--card);color:var(--tx);padding:18px 20px}
dialog::backdrop{background:#0008}.x{float:right;font-size:26px;line-height:1;border:0;background:none;color:var(--mu);cursor:pointer}
h3{margin:0;font:700 22px Georgia,serif}h4{margin:18px 0 0}.big{font:700 28px Georgia,serif;color:var(--ac)}
.lg{font-size:12px;color:var(--mu)}.lg i{display:inline-block;width:14px;height:3px;margin:0 4px 3px 10px}
.ev{display:grid;grid-template-columns:150px 1fr 48px;gap:8px;align-items:center;font-size:13.5px;margin-top:6px}.ev div{position:relative;height:8px;background:var(--bd);border-radius:4px}.ev i{position:absolute;top:0;height:100%}.ev .p{background:var(--up)}.ev .n{background:var(--dn)}.ev b{text-align:right}
footer{margin-top:40px;font-size:12.5px;color:var(--mu)}
@media(max-width:520px){.pick{grid-template-columns:56px 1fr;}.sn{font-size:34px}.pp{grid-column:1/-1;text-align:left}}
</style>
</head>
<body>
<main id="app"><p class="mu">…</p></main>
<script>
if('serviceWorker' in navigator)navigator.serviceWorker.getRegistrations().then(r=>r.forEach(x=>x.unregister()));
if(window.caches)caches.keys().then(k=>k.forEach(x=>caches.delete(x)));

const T={
fr:{sub:"Classement des altcoins du top 100 par un modèle statistique, sur un horizon de 20 jours.",disc:"Outil d'étude, pas un conseil en investissement. Les performances passées ne garantissent pas les résultats futurs.",data:"Scores du",px:"Prix de",dom:"Dominance BTC",top:"Top 5 du moment",topn:"Parmi les coins assez liquides (volume moyen d'au moins 2 M$ par jour).",all:"Classement complet",how:"Le score va de 0 à 100 : c'est le rang relatif du coin selon le modèle (100 = le mieux placé de l'univers).",q:"Rechercher un coin",liq:"Coins liquides seulement",coin:"Coin",score:"Score",price:"Prix",d1:"24 h",d7:"7 j",d30:"30 j",vol:"Volume 30 j",low:"liquidité faible",sim:"Simulateur",simn:"Répartis un capital entre les meilleurs coins et compare-le à l'historique du modèle.",amt:"Capital (USD)",nb:"Nombre de coins",qty:"Quantité",share:"Part",amount:"Montant",hist:"Historique du test sur 20 jours",med:"Médiane",mean:"Moyenne",pos:"Périodes positives",btc:"BTC, même période",warn:"Résultats d'un test sur le passé, gonflés par le biais du survivant : seuls les coins encore dans le top 100 sont inclus. Ce n'est pas une promesse.",old:"Données anciennes : la mise à jour automatique semble arrêtée.",err:"Impossible de charger les données.",none:"Aucun coin ne correspond.",foot:"Données : CoinGecko, Binance, Gate.io, OKX, KuCoin, MEXC. Mise à jour automatique."},
es:{sub:"Clasificación de las altcoins del top 100 con un modelo estadístico, a un horizonte de 20 días.",disc:"Herramienta de estudio, no es asesoramiento de inversión. El rendimiento pasado no garantiza resultados futuros.",data:"Puntuaciones del",px:"Precios de",dom:"Dominancia BTC",top:"Top 5 del momento",topn:"Entre las monedas con liquidez suficiente (volumen medio de al menos 2 M$ al día).",all:"Clasificación completa",how:"La puntuación va de 0 a 100: es la posición relativa de la moneda según el modelo (100 = la mejor del universo).",q:"Buscar una moneda",liq:"Solo monedas líquidas",coin:"Moneda",score:"Puntos",price:"Precio",d1:"24 h",d7:"7 d",d30:"30 d",vol:"Volumen 30 d",low:"liquidez baja",sim:"Simulador",simn:"Reparte un capital entre las mejores monedas y compáralo con el historial del modelo.",amt:"Capital (USD)",nb:"Número de monedas",qty:"Cantidad",share:"Parte",amount:"Importe",hist:"Historial de la prueba a 20 días",med:"Mediana",mean:"Media",pos:"Periodos positivos",btc:"BTC, mismo periodo",warn:"Resultados de una prueba sobre el pasado, inflados por el sesgo de supervivencia: solo se incluyen las monedas que siguen en el top 100. No es una promesa.",old:"Datos antiguos: la actualización automática parece detenida.",err:"No se pueden cargar los datos.",none:"Ninguna moneda coincide.",foot:"Datos: CoinGecko, Binance, Gate.io, OKX, KuCoin, MEXC. Actualización automática."},
en:{sub:"Top 100 altcoins ranked by a statistical model, on a 20-day horizon.",disc:"Research tool, not investment advice. Past performance does not guarantee future results.",data:"Scores as of",px:"Prices at",dom:"BTC dominance",top:"Top 5 right now",topn:"Among coins liquid enough to trade (average volume of at least $2M per day).",all:"Full ranking",how:"The score runs from 0 to 100: it is the coin's relative rank according to the model (100 = best placed in the universe).",q:"Search a coin",liq:"Liquid coins only",coin:"Coin",score:"Score",price:"Price",d1:"24 h",d7:"7 d",d30:"30 d",vol:"30 d volume",low:"low liquidity",sim:"Simulator",simn:"Split a budget across the top coins and compare it with the model's track record.",amt:"Budget (USD)",nb:"Number of coins",qty:"Quantity",share:"Share",amount:"Amount",hist:"Backtest history over 20 days",med:"Median",mean:"Mean",pos:"Positive periods",btc:"BTC, same period",warn:"Results of a test on past data, inflated by survivorship bias: only coins still in the top 100 are included. This is not a promise.",old:"Stale data: the automatic update seems to have stopped.",err:"Could not load the data.",none:"No coin matches.",foot:"Data: CoinGecko, Binance, Gate.io, OKX, KuCoin, MEXC. Updated automatically."}
};
const $=s=>document.querySelector(s);
let L=localStorage.getItem('lang')||(navigator.language||'fr').slice(0,2);if(!T[L])L='fr';
const t=k=>T[L][k];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const nf=(n,d)=>n==null||isNaN(n)?'–':Number(n).toLocaleString(L,{minimumFractionDigits:d,maximumFractionDigits:d});
const usd=p=>p==null?'–':'$'+(p>=100?nf(p,0):p>=1?nf(p,2):nf(p,4));
const pc=v=>v==null?'<span class="mu">–</span>':`<span class="${v>=0?'up':'dn'}">${v>=0?'+':''}${nf(v,1)} %</span>`;
const U={
fr:{mk:"Tendances du marché",fg:"Fear & Greed",fg_n:"0 = peur extrême, 100 = euphorie.",f1:"Peur extrême",f2:"Peur",f3:"Neutre",f4:"Avidité",f5:"Euphorie",alt:"Alt Season",alt_n:"Part des coins qui battent BTC sur 90 j. 75 % ou plus : saison des alts. 25 % ou moins : saison BTC.",a1:"Saison des alts",a2:"Saison BTC",a3:"Intermédiaire",ath:"BTC face à son ATH",ath_n:"Écart au plus haut historique de BTC.",br:"Largeur du marché",br_n:"Part des coins en hausse sur 30 jours.",hv:"Cycle du halving",day:"Jour",hv_n:"Zones d'après les 3 derniers cycles (estimation, échantillon faible) : orange = sommets historiques (jours 365-550), vert = creux historiques (jours 777-930), trait rouge = aujourd'hui, courbe = BTC depuis le halving. Prochain halving vers avril 2028.",p1:"Début de cycle",p2:"Zone de sommet historique",p3:"Marché baissier",p4:"Zone de creux historique",p5:"Fin de cycle",tu:"Haussière",tn:"Neutre",td:"Baissière",i7:"Variation 7 j",i30:"Variation 30 j",i90:"Variation 90 j",ih90:"Écart au plus haut 90 j",ih365:"Écart au plus haut 1 an",iath:"Écart à l'ATH (depuis 2021)",ivol:"Volume vs moyenne 90 j",why:"Pourquoi ce score",why_n:"Effet de chaque famille d'indicateurs sur la probabilité (points de %, positif = favorable).",g_trend:"Tendance",g_risk:"Volatilité",g_highs:"Distance aux plus hauts",g_vol:"Volume et liquidité",g_rsi:"RSI",g_mkt:"Marché global",g_btc:"Lien avec BTC",px_:"Prix et moyennes",cl:"Fermer"},
es:{mk:"Tendencias del mercado",fg:"Fear & Greed",fg_n:"0 = miedo extremo, 100 = euforia.",f1:"Miedo extremo",f2:"Miedo",f3:"Neutral",f4:"Codicia",f5:"Euforia",alt:"Alt Season",alt_n:"Parte de las monedas que superan a BTC en 90 d. 75 % o más: temporada alt. 25 % o menos: temporada BTC.",a1:"Temporada alt",a2:"Temporada BTC",a3:"Intermedio",ath:"BTC frente a su ATH",ath_n:"Distancia al máximo histórico de BTC.",br:"Amplitud del mercado",br_n:"Parte de las monedas al alza en 30 días.",hv:"Ciclo del halving",day:"Día",hv_n:"Zonas según los 3 últimos ciclos (estimación, muestra pequeña): naranja = máximos históricos (días 365-550), verde = mínimos históricos (días 777-930), línea roja = hoy, curva = BTC desde el halving. Próximo halving hacia abril de 2028.",p1:"Inicio de ciclo",p2:"Zona de máximo histórico",p3:"Mercado bajista",p4:"Zona de mínimo histórico",p5:"Final de ciclo",tu:"Alcista",tn:"Neutral",td:"Bajista",i7:"Variación 7 d",i30:"Variación 30 d",i90:"Variación 90 d",ih90:"Distancia al máximo de 90 d",ih365:"Distancia al máximo de 1 año",iath:"Distancia al ATH (desde 2021)",ivol:"Volumen vs media de 90 d",why:"Por qué esta puntuación",why_n:"Efecto de cada familia de indicadores en la probabilidad (puntos de %, positivo = favorable).",g_trend:"Tendencia",g_risk:"Volatilidad",g_highs:"Distancia a máximos",g_vol:"Volumen y liquidez",g_rsi:"RSI",g_mkt:"Mercado global",g_btc:"Relación con BTC",px_:"Precio y medias",cl:"Cerrar"},
en:{mk:"Market trends",fg:"Fear & Greed",fg_n:"0 = extreme fear, 100 = euphoria.",f1:"Extreme fear",f2:"Fear",f3:"Neutral",f4:"Greed",f5:"Euphoria",alt:"Alt Season",alt_n:"Share of coins beating BTC over 90 d. 75% or more: alt season. 25% or less: BTC season.",a1:"Alt season",a2:"BTC season",a3:"In between",ath:"BTC vs its ATH",ath_n:"Distance from BTC's all-time high.",br:"Market breadth",br_n:"Share of coins up over 30 days.",hv:"Halving cycle",day:"Day",hv_n:"Zones based on the last 3 cycles (estimate, small sample): orange = historical tops (days 365-550), green = historical bottoms (days 777-930), red line = today, curve = BTC since the halving. Next halving around April 2028.",p1:"Early cycle",p2:"Historical top zone",p3:"Bear market",p4:"Historical bottom zone",p5:"Late cycle",tu:"Bullish",tn:"Neutral",td:"Bearish",i7:"7 d change",i30:"30 d change",i90:"90 d change",ih90:"From 90 d high",ih365:"From 1 y high",iath:"From ATH (since 2021)",ivol:"Volume vs 90 d average",why:"Why this score",why_n:"Effect of each indicator family on the probability (% points, positive = favourable).",g_trend:"Trend",g_risk:"Volatility",g_highs:"Distance from highs",g_vol:"Volume and liquidity",g_rsi:"RSI",g_mkt:"Overall market",g_btc:"Link with BTC",px_:"Price and averages",cl:"Close"}};
for(const l in U)Object.assign(T[l],U[l]);
const S={q:'',liq:true,amt:1000,n:5,sc:null,rep:null,live:null,px:{},mk:null,det:null};
const lv=c=>{const x=S.px[c.symbole];return x&&c.prix&&x.prix/c.prix>.5&&x.prix/c.prix<2?x:null};
const price=c=>(lv(c)||c).prix;

const RAW='https://raw.githubusercontent.com/NalistPro/Altracker/main/';
async function j(u){
  for(const x of u.startsWith('http')?[u]:[u,RAW+u]){
    try{const r=await fetch(x,{cache:'no-store'});if(r.ok)return await r.json()}catch(e){}
  }
  throw new Error(u);
}
async function load(){
  try{[S.sc,S.rep]=await Promise.all([j('data/model/latest_scores.json'),j('data/model/backtest_report.json')])}
  catch(e){$('#app').innerHTML=`<p class="err">${t('err')}</p>`;return}
  try{S.live=await j('https://raw.githubusercontent.com/NalistPro/Altracker/live/live.json');S.live.coins.forEach(c=>S.px[c.symbole]=c)}catch(e){S.live=null}
  try{S.mk=await j('data/model/market.json')}catch(e){}
  try{S.det=await j('data/model/detail.json')}catch(e){}
  shell();
}
function shell(){
  document.documentElement.lang=L;
  const nOpt=[1,2,3,4,5].map(i=>`<option ${i===S.n?'selected':''}>${i}</option>`).join('');
  $('#app').innerHTML=`
  <header><h1>Altracker</h1>
   <div class="lang">${['fr','es','en'].map(l=>`<button data-l="${l}" aria-pressed="${l===L}">${l.toUpperCase()}</button>`).join('')}</div>
   <p class="sub">${t('sub')}</p></header>
  <p class="disc">${t('disc')}</p>
  <p class="meta" id="meta"></p>
  <section><h2>${t('mk')}</h2><div class="mk" id="mk"></div></section>
  <section><h2>${t('top')}</h2><p class="mu">${t('topn')}</p><ol id="top"></ol></section>
  <section><h2>${t('all')}</h2><p class="mu">${t('how')}</p>
   <div class="tools"><input type="search" id="q" placeholder="${t('q')}" value="${esc(S.q)}" aria-label="${t('q')}">
   <label><input type="checkbox" id="lq" ${S.liq?'checked':''}> ${t('liq')}</label></div>
   <div class="tw"><table><thead><tr><th>#</th><th>${t('coin')}</th><th>${t('score')}</th><th>${t('price')}</th><th>${t('d1')}</th><th>${t('d7')}</th><th>${t('d30')}</th><th>${t('vol')}</th></tr></thead><tbody id="tb"></tbody></table></div></section>
  <section><h2>${t('sim')}</h2><p class="mu">${t('simn')}</p>
   <div class="tools"><label>${t('amt')} <input type="number" id="am" min="10" step="100" value="${S.amt}"></label>
   <label>${t('nb')} <select id="nn">${nOpt}</select></label></div><div id="sm"></div></section>
  <dialog id="dg"></dialog><footer>${t('foot')}</footer>`;
  document.querySelectorAll('.lang button').forEach(b=>b.onclick=()=>{L=b.dataset.l;localStorage.setItem('lang',L);shell()});
  $('#q').oninput=e=>{S.q=e.target.value;table()};
  $('#lq').onchange=e=>{S.liq=e.target.checked;table()};
  $('#am').oninput=e=>{S.amt=Math.max(0,+e.target.value||0);sim()};
  $('#nn').onchange=e=>{S.n=+e.target.value;sim()};
  $('#app').onclick=e=>{const r=e.target.closest('[data-s]');if(r)fiche(r.dataset.s)};
  $('#dg').onclick=e=>{if(e.target.id==='dg'||e.target.dataset.x)$('#dg').close()};
  head();market();picks();table();sim();
}
function head(){
  const sc=S.sc,age=(Date.now()-new Date(sc.date_donnees+'T00:00:00Z'))/864e5,lv_=S.live;
  const px=lv_?new Date(lv_.mis_a_jour_utc).toLocaleTimeString(L,{hour:'2-digit',minute:'2-digit'}):null;
  $('#meta').innerHTML=`<span>${t('data')} ${new Date(sc.date_donnees+'T00:00:00Z').toLocaleDateString(L,{day:'numeric',month:'short',year:'numeric',timeZone:'UTC'})}</span>`
   +(px?`<span>${t('px')} ${px}</span>`:'')+(lv_&&lv_.dominance_btc?`<span>${t('dom')} ${nf(lv_.dominance_btc,1)} %</span>`:'')
   +(age>3?`<span class="err">${t('old')}</span>`:'');
}
const topList=()=>S.sc.top5.map(s=>S.sc.classement.find(c=>c.symbole===s)).filter(Boolean);
function picks(){
  $('#top').innerHTML=topList().map(c=>`<li class="pick cl" data-s="${esc(c.symbole)}"><div class="sn">${c.score}</div>
   <div><b>${esc(c.symbole)}</b> <span class="mu">${esc(c.nom)}</span><div class="bar"><i style="width:${c.score}%"></i></div></div>
   <div class="pp"><b>${usd(price(c))}</b><small>${pc(c['ret7_%'])} ${t('d7')}</small><small>${pc(c['ret30_%'])} ${t('d30')}</small></div></li>`).join('');
}
function table(){
  const q=S.q.trim().toLowerCase();
  const rows=S.sc.classement.filter(c=>(!S.liq||c.liquide)&&(!q||c.symbole.toLowerCase().includes(q)||c.nom.toLowerCase().includes(q)));
  $('#tb').innerHTML=rows.length?rows.map(c=>{const x=lv(c);return `<tr class="cl" data-s="${esc(c.symbole)}"><td>${c.rang}</td><td><b>${esc(c.symbole)}</b> <span class="mu">${esc(c.nom)}</span>${c.liquide?'':` <span class="low">${t('low')}</span>`}</td>
   <td><span class="mb"><i style="width:${c.score}%"></i></span>${c.score}</td><td>${usd(price(c))}</td><td>${pc(x?x.var_24h:null)}</td><td>${pc(c['ret7_%'])}</td><td>${pc(c['ret30_%'])}</td><td>$${nf(c['volume_30j_Musd'],1)}M</td></tr>`}).join('')
   :`<tr><td colspan="8" class="mu" style="text-align:center">${t('none')}</td></tr>`;
}
function sim(){
  const p=topList().slice(0,S.n),k=p.length||1,a=S.amt/k,st=S.rep.strategies_top5,m=st.modele_top5_liquide,b=st.btc;
  const g=v=>`${v>=0?'+':'−'}$${nf(Math.abs(S.amt*v/100),0)}`;
  $('#sm').innerHTML=`<div class="tw"><table><thead><tr><th>${t('coin')}</th><th></th><th>${t('share')}</th><th>${t('amount')}</th><th>${t('qty')}</th></tr></thead><tbody>`
   +p.map(c=>{const q=a/price(c);return `<tr><td><b>${esc(c.symbole)}</b></td><td></td><td>${nf(100/k,0)} %</td><td>$${nf(a,0)}</td><td>${nf(q,q>=100?0:q>=1?2:4)}</td></tr>`}).join('')+`</tbody></table></div>
   <div class="box"><b>${t('hist')}</b>
    <p>${t('med')} : ${pc(m['rendement_median_20j_%'])} (${g(m['rendement_median_20j_%'])}) &nbsp; ${t('mean')} : ${pc(m['rendement_moyen_20j_%'])} (${g(m['rendement_moyen_20j_%'])})</p>
    <p>${t('pos')} : ${nf(m['periodes_positives_%'],0)} % &nbsp; ${t('btc')} : ${t('med')} ${pc(b['rendement_median_20j_%'])}</p>
    <p class="warn">${t('warn')}</p></div>`;
}
const pth=(v,w,h,lo,hi)=>v.map((y,i)=>(i?'L':'M')+(i/(v.length-1||1)*w).toFixed(1)+' '+(h-(y-lo)/((hi-lo)||1)*h).toFixed(1)).join('');
function spark(s,lo,hi,g){const v=s.map(x=>x[1]),Y=y=>(64-(y-lo)/(hi-lo)*64).toFixed(1);
  return `<svg viewBox="0 0 300 64" width="100%" preserveAspectRatio="none" aria-hidden="true" style="height:64px">${(g||[]).map(y=>`<line x1="0" x2="300" y1="${Y(y)}" y2="${Y(y)}" stroke="var(--bd)" stroke-dasharray="3 3"/>`).join('')}<path d="${pth(v,300,64,lo,hi)}" fill="none" stroke="var(--ac)" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>`}
const card=(ti,big,lab,note,sv,cls)=>`<div class="card ${cls||''}"><div class="ct">${ti}</div><div class="cb">${big}<span>${lab||''}</span></div>${sv}<p>${note}</p></div>`;
function market(){
  const m=S.mk;if(!m){$('#mk').innerHTML='';return}
  const f=m.fng.valeur,fl=t(f<25?'f1':f<45?'f2':f<56?'f3':f<75?'f4':'f5'),a=m.alt.valeur,al=t(a>=75?'a1':a<=25?'a2':'a3');
  const h=m.halving,c=h.courbe,ys=c.map(x=>x[1]),lo=Math.min(...ys)*.9,hi=Math.max(...ys)*1.05,X=d=>d/1460*600;
  const ph=t(h.jour<365?'p1':h.jour<=550?'p2':h.jour<777?'p3':h.jour<=930?'p4':'p5');
  const bd=(a,b,col)=>`<rect x="${X(a)}" y="0" width="${X(b)-X(a)}" height="120" fill="${col}" opacity=".2"/>`;
  const hv=`<svg viewBox="0 0 600 120" width="100%" aria-hidden="true">${bd(365,550,'var(--wa)')}${bd(777,930,'var(--up)')}<path d="${c.map((p,i)=>(i?'L':'M')+X(p[0]).toFixed(1)+' '+(120-(p[1]-lo)/(hi-lo)*120).toFixed(1)).join('')}" fill="none" stroke="var(--tx)" stroke-width="2"/><line x1="${X(h.jour)}" x2="${X(h.jour)}" y1="0" y2="120" stroke="var(--dn)" stroke-width="2"/></svg>`;
  $('#mk').innerHTML=card(t('fg'),f,fl,t('fg_n'),spark(m.fng.serie,0,100,[25,75]))
   +card(t('alt'),a+' %',al,t('alt_n'),spark(m.alt.serie,0,100,[25,75]))
   +card(t('ath'),nf(m.btc_ath.valeur,1)+' %','$'+nf(m.btc_ath.ath_prix,0),t('ath_n'),spark(m.btc_ath.serie,Math.min(-60,...m.btc_ath.serie.map(x=>x[1])),0,[]))
   +card(t('br'),m.breadth.valeur+' %','',t('br_n'),spark(m.breadth.serie,0,100,[50]))
   +card(t('hv'),t('day')+' '+h.jour,ph,t('hv_n'),hv,'wide');
}
const sma=(v,n)=>v.map((_,i)=>i<n-1?null:v.slice(i-n+1,i+1).reduce((a,b)=>a+b,0)/n);
function fiche(sym){
  const d=S.det&&S.det.coins[sym],c=S.sc.classement.find(x=>x.symbole===sym);if(!d||!c)return;
  const v=d.c,N=Math.min(180,v.length),o=v.length-N,A=[sma(v,20),sma(v,50),sma(v,100)],w=v.slice(o),lo=Math.min(...w)*.97,hi=Math.max(...w)*1.03;
  const P=a=>{let s='',k=0;a.slice(o).forEach((y,i)=>{if(y==null)return;s+=(k?'L':'M')+(i/(N-1)*600).toFixed(1)+' '+(200-(y-lo)/(hi-lo)*200).toFixed(1);k=1});return s};
  const L=v[v.length-1],[a20,a50,a100]=A.map(x=>x[x.length-1]);
  const tr=L>a20&&L>a50&&a20>a50?['up',t('tu')]:L<a20&&L<a50&&L<a100?['dn',t('td')]:['mu',t('tn')];
  const i=d.i,E=x=>x==null?null:Math.expm1(x)*100,Q=x=>x==null?null:x*100;
  const rows=[['i7',E(i.ret7)],['i30',E(i.ret30)],['i90',E(i.ret90)],['ih90',Q(i.dd90)],['ih365',Q(i.dd365)],['iath',Q(i.dd_ath)],['ivol',E(i.vol_rel)]];
  const mx=Math.max(...d.e.map(x=>Math.abs(x[1])),1);
  $('#dg').innerHTML=`<button data-x="1" class="x" aria-label="${t('cl')}">×</button><h3>${esc(sym)} <span class="mu">${esc(c.nom)}</span></h3>
   <p><b class="big">${c.score}</b> ${t('score')} &nbsp; ${usd(price(c))} &nbsp; <b class="${tr[0]}">${tr[1]}</b> &nbsp; RSI ${nf(i.rsi14,0)}</p>
   <svg viewBox="0 0 600 200" width="100%" aria-hidden="true"><path d="${P(v)}" fill="none" stroke="var(--tx)" stroke-width="2"/><path d="${P(A[0])}" fill="none" stroke="#c2410c" stroke-width="1.5"/><path d="${P(A[1])}" fill="none" stroke="var(--ac)" stroke-width="1.5"/><path d="${P(A[2])}" fill="none" stroke="#7c3aed" stroke-width="1.5"/></svg>
   <p class="lg"><i style="background:var(--tx)"></i>${t('px_')} <i style="background:#c2410c"></i>20 <i style="background:var(--ac)"></i>50 <i style="background:#7c3aed"></i>100</p>
   <div class="tw"><table><tbody>${rows.map(r=>`<tr><td>${t(r[0])}</td><td>${pc(r[1])}</td></tr>`).join('')}</tbody></table></div>
   <h4>${t('why')}</h4><p class="mu">${t('why_n')}</p>
   ${d.e.map(x=>`<div class="ev"><span>${t('g_'+x[0])}</span><div><i class="${x[1]>=0?'p':'n'}" style="width:${Math.abs(x[1])/mx*50}%;${x[1]>=0?'left':'right'}:50%"></i></div><b>${x[1]>0?'+':''}${nf(x[1],1)}</b></div>`).join('')}`;
  $('#dg').showModal();
}
load();
</script>
</body>
</html>
